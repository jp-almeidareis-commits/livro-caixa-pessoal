  });
  const grupos = detectarGruposParcela();
  if (grupos.length > 0) {
    h += `<p class="panel-title" style="margin-top:16px;">Projeções que parecem parcelas</p>`;
    h += `<p class="hint" style="margin-top:0;">Estas projeções têm "(parcela n/N)" no nome. Converta para tirá-las da lista de metas e passá-las ao bloco de parcelas e às faturas.</p>`;
    grupos.forEach((g) => {
      h += `<div class="naoprevisto-row"><span><strong>${esc(g.base)}</strong> <span class="muted">${g.itens.length} projeções · parcelas ${g.itens[0].num} a ${g.itens[g.itens.length - 1].num} de ${g.total}</span></span><span style="display:flex;align-items:center;gap:6px;"><select class="field" style="width:auto;min-height:32px;padding:3px 8px;" id="conv-cartao-${esc(g.key)}"><option value="">Cartão...</option>${state.cartoes.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select><button class="btn btn-outline" style="font-size:12px;min-height:32px;" data-action="conv-parc" data-key="${esc(g.key)}">Converter</button></span></div>`;
    });
  }
  h += `</div>`;
  return h;
}

function metaStatus(r) {
  if (r.finalizado) return { id: "fechada", label: "✓ fechada", cor: C.green, ordem: 5 };
  if (r.type === "despesa" && r.excedida) return { id: "estourada", label: "estourada", cor: C.red, ordem: 0 };
  if (!r.lancado && r.dueDate) {
    const dias = diasAte(r.dueDate), dia = parseInt(r.diaVencimento, 10);
    if (dias < 0) return { id: "vencida", label: `vencida há ${-dias}d · dia ${dia}`, cor: C.red, ordem: 0, dias };
    if (dias <= 5) return { id: "vencendo", label: dias === 0 ? "vence hoje" : `vence em ${dias}d · dia ${dia}`, cor: C.brass, ordem: 1, dias };
    return { id: "pendente", label: `pendente · vence dia ${dia}`, cor: C.brass, ordem: 2 };
  }
  if (!r.lancado) return { id: "pendente", label: "pendente", cor: C.brass, ordem: 2 };
  if (r.type === "receita" && r.excedida) return { id: "acima", label: "acima do previsto", cor: C.green, ordem: 4 };
  if (r.realizado >= r.value) return { id: "lancada", label: "lançada", cor: C.green, ordem: 4 };
  return { id: "andamento", label: "em andamento", cor: C.inkSoft, ordem: 3 };
}

function getMonthComparison(yearOverride, monthOverride) {
  const hasOverride = yearOverride !== undefined && monthOverride !== undefined;
  if (!hasOverride && state.showAll) return null;
  const y = hasOverride ? yearOverride : state.selectedYear;
  const m = hasOverride ? monthOverride : state.selectedMonth;
  const key = `${y}-${pad2(m + 1)}`;
  const planned = getPlannedItemsForMonth(state.plannedItems, y, m);
  const monthReal = transactionsInPeriod(state.transactions, y, m);
  const usedRealIds = new Set();
  const parcIds = new Set((state.parcelados || []).map((x) => x.id));
  const isParc = (t) => !!t.parcelaId && parcIds.has(t.parcelaId);
  const rows = planned.map((p) => {
    // Etiqueta explícita (plannedItemId) tem prioridade; sem etiqueta, cai pro nome idêntico
    // (compatibilidade com lançamentos antigos, que nunca tiveram esse campo).
    const matches = monthReal.filter((t) => !isParc(t) && t.type === p.type && (
      t.plannedItemId ? t.plannedItemId === p.id : t.description.trim().toLowerCase() === p.description.trim().toLowerCase()
    ));
    matches.forEach((m) => usedRealIds.add(m.id));
    const realizado = matches.reduce((s, t) => s + Number(t.value), 0);
    const lancado = matches.length > 0;
    const diff = realizado - p.value;
    const favoravel = p.type === "receita" ? diff >= 0 : diff <= 0;
    const excedida = lancado && realizado > p.value;
    const noteKey = `${key}-${p.id}`;
    // "Finalizado" é um trava manual: quando marcado, a projeção passa a considerar
    // definitivamente o valor lançado (mesmo abaixo da meta) em vez de assumir que o
    // restante ainda vai ser gasto/recebido — ex: condomínio orçado em 600, rateio saiu
    // 575 e não muda mais, então a partir daí conta 575.
    const finalizado = !!state.finalizados[noteKey];
    const atualizado = finalizado ? realizado : excedida ? realizado : p.value;
    return { ...p, realizado, lancado, diff, favoravel, excedida, finalizado, atualizado, noteKey, lancamentos: matches, dueDate: dueDateFor(p, key) };
  });
  // Parcelas de cartão: lançamentos vinculados a uma parcela não são "não previstos" — contam na parcela.
  monthReal.filter(isParc).forEach((t) => usedRealIds.add(t.id));
  const parcelasMes = parcelasDoMes(key);
  const parcPlan = parcelasMes.reduce((s, x) => s + x.valor, 0);
  const parcAtual = parcelasMes.reduce((s, x) => s + x.atual, 0);
  const parcReal = parcelasMes.reduce((s, x) => s + x.realizado, 0);
  const parcPend = parcelasMes.reduce((s, x) => s + (x.lancada ? 0 : x.valor), 0);
  const naoPrevistos = monthReal.filter((t) => !usedRealIds.has(t.id));
  const naoPrevistosReceita = naoPrevistos.filter((t) => t.type === "receita").reduce((s, t) => s + Number(t.value), 0);
  const naoPrevistosDespesa = naoPrevistos.filter((t) => t.type === "despesa").reduce((s, t) => s + Number(t.value), 0);
  const totalPlanejadoReceita = planned.filter((p) => p.type === "receita").reduce((s, p) => s + p.value, 0);
  const totalPlanejadoDespesa = planned.filter((p) => p.type === "despesa").reduce((s, p) => s + p.value, 0) + parcPlan;
  const totalRealizadoReceita = rows.filter((r) => r.type === "receita").reduce((s, r) => s + r.realizado, 0) + naoPrevistosReceita;
  const totalRealizadoDespesa = rows.filter((r) => r.type === "despesa").reduce((s, r) => s + r.realizado, 0) + naoPrevistosDespesa + parcReal;
  // Atualizado = meta, mas sobe pro valor real quando ele já foi lançado e excedeu a meta,
  // ou trava no valor real quando o item foi marcado como "finalizado".
  // Não previstos entram inteiros, pois são gasto/receita real fora do planejamento original.
  const totalAtualizadoReceita = rows.filter((r) => r.type === "receita").reduce((s, r) => s + r.atualizado, 0) + naoPrevistosReceita;
  const totalAtualizadoDespesa = rows.filter((r) => r.type === "despesa").reduce((s, r) => s + r.atualizado, 0) + naoPrevistosDespesa + parcAtual;
  // "A pagar" / "a receber" = a diferença entre o Atualizado e o já lançado, por item — ou
  // seja, o que ainda falta pra cada meta bater (0 quando excedida ou finalizada).
  const aPagar = rows.filter((r) => r.type === "despesa").reduce((s, r) => s + Math.max(0, r.atualizado - r.realizado), 0) + parcPend;
  const aReceber = rows.filter((r) => r.type === "receita").reduce((s, r) => s + Math.max(0, r.atualizado - r.realizado), 0);
  return { key, rows, naoPrevistos, naoPrevistosReceita, naoPrevistosDespesa, allReal: monthReal, totalPlanejadoReceita, totalPlanejadoDespesa, totalAtualizadoReceita, totalAtualizadoDespesa, totalRealizadoReceita, totalRealizadoDespesa, aPagar, aReceber, parcelasMes, parcPlan, parcAtual, parcReal, parcPend };
}

// Saldo inicial projetado de um mês = soma do líquido "Atualizado" (projetado) de todos os
// meses anteriores, desde o início oficial (setembro/2026). Assim outubro já nasce sabendo
// que setembro pode fechar diferente do que já foi lançado até agora — a projeção encadeia
// mês a mês, em vez de olhar só o saldo real acumulado até hoje.
function saldoInicioProjetado(year, month) {
  if (year < 2026 || (year === 2026 && month < 8)) return 0; // antes do início oficial
  let total = 0;
  let y = 2026, m = 8; // setembro/2026
  while (y < year || (y === year && m < month)) {
    const mc = getMonthComparison(y, m);
    total += mc.totalAtualizadoReceita - mc.totalAtualizadoDespesa;
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return total;
}

// ================= RENDER =================
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// ================= GRÁFICOS (SVG puro, responsivos, claro/escuro) =================
function fmtK(v) {
  const a = Math.abs(v), sg = v < 0 ? "-" : "";
  if (a >= 1e6) return sg + (a / 1e6).toFixed(1).replace(".", ",") + " mi";
  if (a >= 1e3) return sg + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(".", ",") + " mil";
  return sg + Math.round(a);
}
function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 6 ? 6 : f <= 8 ? 8 : 10) * e;
}
function chartLegend(items) {
  return `<div class="chart-legend">${items.map((i) => `<span><i style="background:${i.cor}"></i>${esc(i.nome)}</span>`).join("")}</div>`;
}
// Barras agrupadas: data = [{label, vals:[...]}], series = [{nome, cor}]
function svgGroupedBars(data, series) {
  const W = 640, H = 230, L = 50, R = 8, T = 12, B = 30, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...data.flatMap((d) => d.vals)));
  const gw = iw / data.length, bw = Math.min(26, (gw * 0.8) / series.length);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - (ih * i) / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="10" style="fill:var(--ink-soft)">${fmtK((max * i) / 4)}</text>`;
  }
  data.forEach((d, i) => {
    const x0 = L + gw * i + (gw - bw * series.length) / 2;
    d.vals.forEach((v, k) => {
      const h = Math.max(v > 0 ? 1.5 : 0, (v / max) * ih);
      g += `<rect x="${x0 + bw * k}" y="${T + ih - h}" width="${bw - 2}" height="${h}" rx="2" style="fill:${series[k].cor}"><title>${esc(d.label)} · ${esc(series[k].nome)}: ${brl(v)}</title></rect>`;
    });
    g += `<text x="${L + gw * i + gw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" style="fill:var(--ink-soft)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:260px" role="img">${g}</svg>`;
}
// Barras empilhadas: data = [{label, vals:[...]}]
function svgStackedBars(data, series) {
  const W = 640, H = 230, L = 50, R = 8, T = 12, B = 30, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...data.map((d) => d.vals.reduce((s, v) => s + v, 0))));
  const gw = iw / data.length, bw = Math.min(44, gw * 0.6);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - (ih * i) / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="10" style="fill:var(--ink-soft)">${fmtK((max * i) / 4)}</text>`;
  }
  data.forEach((d, i) => {
    let acc = 0; const x = L + gw * i + (gw - bw) / 2;
    d.vals.forEach((v, k) => {
      if (v <= 0) return;
      const h = (v / max) * ih, y = T + ih - acc - h; acc += h;
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" style="fill:${series[k].cor};stroke:var(--paper)" stroke-width="1"><title>${esc(d.label)} · ${esc(series[k].nome)}: ${brl(v)}</title></rect>`;
    });
    g += `<text x="${L + gw * i + gw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" style="fill:var(--ink-soft)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:260px" role="img">${g}</svg>`;
}
// Linha: pts = [{label, v}]
function svgLine(pts) {
  const W = 640, H = 230, L = 56, R = 14, T = 14, B = 30, iw = W - L - R, ih = H - T - B;
  let mx = Math.max(0, ...pts.map((p) => p.v)), mn = Math.min(0, ...pts.map((p) => p.v));
  if (mx === mn) mx = mn + 1;
  const span = niceMax(mx - mn), top = mn + span >= mx ? mn + span : mx;
  const yOf = (v) => T + ih - ((v - mn) / (top - mn)) * ih;
  const xOf = (i) => L + (pts.length === 1 ? iw / 2 : (iw * i) / (pts.length - 1));
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = mn + ((top - mn) * i) / 4, y = yOf(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="10" style="fill:var(--ink-soft)">${fmtK(v)}</text>`;
  }
  g += `<line x1="${L}" x2="${W - R}" y1="${yOf(0)}" y2="${yOf(0)}" style="stroke:var(--ink-soft)" stroke-dasharray="4 3"/>`;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${xOf(i)},${yOf(p.v)}`).join(" ");
  g += `<path d="${d} L${xOf(pts.length - 1)},${yOf(0)} L${xOf(0)},${yOf(0)} Z" style="fill:var(--brass);opacity:.12"/>`;
  g += `<path d="${d}" fill="none" style="stroke:var(--brass)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const step = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    g += `<circle cx="${xOf(i)}" cy="${yOf(p.v)}" r="4" style="fill:${p.v >= 0 ? "var(--green)" : "var(--red)"};stroke:var(--paper)" stroke-width="1.5"><title>${esc(p.label)}: ${brl(p.v)}</title></circle>`;
    if (i % step === 0 || i === pts.length - 1) g += `<text x="${xOf(i)}" y="${H - 10}" text-anchor="middle" font-size="10" style="fill:var(--ink-soft)">${esc(p.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:260px" role="img">${g}</svg>`;
}
// Rosca: items = [{nome, cor, val}] — agrupa o excedente em "Outros"
function donutChart(items, centro) {
  const MAXF = 7;
  let list = [...items].filter((i) => i.val > 0).sort((a, b) => b.val - a.val);
  if (list.length > MAXF) {
    const resto = list.slice(MAXF - 1).reduce((s, i) => s + i.val, 0);
    list = [...list.slice(0, MAXF - 1), { nome: "Outros", cor: "#94A3B8", val: resto }];
  }
  const total = list.reduce((s, i) => s + i.val, 0);
  if (total <= 0) return "";
  const R = 70, CIRC = 2 * Math.PI * R;
  let off = 0, arcs = "";
  list.forEach((i) => {
    const len = (i.val / total) * CIRC;
    arcs += `<circle cx="100" cy="100" r="${R}" fill="none" style="stroke:${i.cor}" stroke-width="30" stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(i.nome)}: ${brl(i.val)} (${((i.val / total) * 100).toFixed(0)}%)</title></circle>`;
    off += len;
  });
  const svg = `<svg viewBox="0 0 200 200" style="width:200px;height:200px;flex-shrink:0" role="img">${arcs}<text x="100" y="96" text-anchor="middle" font-size="10" style="fill:var(--ink-soft)">${esc(centro)}</text><text x="100" y="114" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--ink)">${brl(total)}</text></svg>`;
  const leg = list.map((i) => `<div class="donut-row"><span><i style="background:${i.cor}"></i>${esc(i.nome)}</span><span><b>${brl(i.val)}</b> <span class="muted">${((i.val / total) * 100).toFixed(0)}%</span></span></div>`).join("");
  return `<div class="donut-wrap">${svg}<div class="donut-legend">${leg}</div></div>`;
}
// Projetado × realizado (barras horizontais pareadas): items = [{nome, plan, real}]
function pairedBars(items, tipo) {
  const max = Math.max(1, ...items.flatMap((i) => [i.plan, i.real]));
  const bom = tipo === "receita" ? C.green : C.red;
  let h = `<div class="chart-legend"><span><i style="background:var(--line)"></i>Projetado</span><span><i style="background:${bom}"></i>Realizado</span></div>`;
  items.forEach((i) => {
    h += `<div class="bar-chart-row" title="${esc(i.nome)}: projetado ${brl(i.plan)} · realizado ${brl(i.real)}"><span class="bar-chart-label pb-label">${esc(i.nome)}</span><span class="bar-chart-track" style="height:20px;background:transparent;"><span class="bar-chart-fill" style="height:9px;margin-bottom:2px;width:${(i.plan / max) * 100}%;background:var(--line)"></span><span class="bar-chart-fill" style="height:9px;width:${(i.real / max) * 100}%;background:${bom}"></span></span><span class="bar-chart-value pb-value">${brl(i.real)} <span class="muted">/ ${brl(i.plan)}</span></span></div>`;
  });
  return h;
}

// ================= RELATÓRIOS =================
function mesesComDados() {
  return getPlannerMonths().filter((pm) => transactionsInPeriod(state.transactions, pm.year, pm.month).length > 0);
}

function dadosMensaisHistorico() {
  return mesesComDados().map((pm) => {
    const mc = getMonthComparison(pm.year, pm.month);
    const receita = mc.totalRealizadoReceita, despesa = mc.totalRealizadoDespesa;
    const taxaPoupanca = receita > 0 ? ((receita - despesa) / receita) * 100 : null;
    return { ...pm, receita, despesa, saldo: receita - despesa, taxaPoupanca };
  });
}

function buildRelatoriosHTML() {
  let html = `<div class="body-panel">`;
  html += `<div class="report-nav">`;
  // "emprestimos" fica de fora da lista visível de propósito — é uma aba discreta, acessada só pelo ponto nas reticências.
  const abas = [
    ["geral", "📋 Visão geral"], ["categorias", "🏷️ Categorias"], ["metas", "🎯 Metas"],
    ["cartao", "💳 Faturas"], ["calendario", "📅 Calendário"], ["evolucao", "📈 Evolução do saldo"], ["bichos", "🐾 Bichos"],
  ];
  abas.forEach(([id, label]) => { html += `<button class="report-nav-btn ${state.reportTab === id ? "active" : ""}" data-action="set-report-tab" data-report="${id}">${label}</button>`; });
  html += `<button class="report-nav-btn ${state.reportTab === "emprestimos" ? "active" : ""}" data-action="set-report-tab" data-report="emprestimos" title="." style="margin-left:auto;opacity:0.35;padding:6px 10px;">···</button>`;
  html += `</div><div class="content">`;

  if (state.reportTab === "geral") html += reportGeral();
  else if (state.reportTab === "categorias") html += reportCategorias();
  else if (state.reportTab === "metas") html += reportMetas();
  else if (state.reportTab === "cartao") html += reportCartao();
  else if (state.reportTab === "calendario") html += reportCalendario();
  else if (state.reportTab === "evolucao") html += reportEvolucao();
  else if (state.reportTab === "bichos") html += reportBichos();
  else if (state.reportTab === "emprestimos") html += reportEmprestimos();

  html += `</div></div>`;
  return html;
}

// ---------- Visão geral: taxa de poupança + reserva de emergência ----------
function reportGeral() {
  const historico = dadosMensaisHistorico();
  const todayStr = localTodayISO();
  const realAteHoje = state.transactions.filter((t) => cashKey(t) >= "2026-08-27" && cashKey(t) <= todayStr);
  const saldoAtual = (() => { const b = computeRunningBalance(realAteHoje); return b.length ? b[b.length - 1].balance : 0; })();
  const mediaDespesa = historico.length ? historico.reduce((s, m) => s + m.despesa, 0) / historico.length : 0;
  const mesesReserva = mediaDespesa > 0 ? saldoAtual / mediaDespesa : null;
  const taxaMedia = (() => {
    const validas = historico.filter((m) => m.taxaPoupanca !== null);
    return validas.length ? validas.reduce((s, m) => s + m.taxaPoupanca, 0) / validas.length : null;
  })();

  let h = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;">`;
  h += `<div class="kpi-card"><p class="kpi-label">💰 Saldo atual (desde 27/08)</p><p class="kpi-value" style="color:${saldoAtual >= 0 ? C.green : C.red}">${brl(saldoAtual)}</p></div>`;
  h += `<div class="kpi-card"><p class="kpi-label">🛟 Meses de reserva de emergência</p><p class="kpi-value" style="color:${mesesReserva === null ? C.inkSoft : mesesReserva >= 3 ? C.green : mesesReserva >= 1 ? C.brass : C.red}">${mesesReserva === null ? "—" : mesesReserva.toFixed(1) + "x"}</p><p class="hint" style="margin:4px 0 0;">saldo ÷ despesa média mensal (${brl(mediaDespesa)})</p></div>`;
  h += `<div class="kpi-card"><p class="kpi-label">📊 Taxa de poupança média</p><p class="kpi-value" style="color:${taxaMedia === null ? C.inkSoft : taxaMedia >= 0 ? C.green : C.red}">${taxaMedia === null ? "—" : taxaMedia.toFixed(1) + "%"}</p><p class="hint" style="margin:4px 0 0;">quanto da receita sobrou, em média</p></div>`;
  h += `</div>`;

  if (historico.length > 0) {
    h += `<div class="chart-box"><p class="panel-title" style="margin-top:0;">Receitas × despesas por mês</p>`;
    h += chartLegend([{ nome: "Receitas", cor: "var(--green)" }, { nome: "Despesas", cor: "var(--red)" }]);
    h += svgGroupedBars(historico.map((m) => ({ label: m.label, vals: [m.receita, m.despesa] })), [{ nome: "Receitas", cor: "var(--green)" }, { nome: "Despesas", cor: "var(--red)" }]);
    h += `</div>`;
  }
  h += `<p class="panel-title">Taxa de poupança por mês</p>`;
  if (historico.length === 0) {
    h += `<p class="hint">Ainda não há lançamentos reais pra calcular histórico.</p>`;
  } else {
    h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Mês</th><th>Receita</th><th>Despesa</th><th>Saldo</th><th>Taxa de poupança</th></tr></thead><tbody>`;
    [...historico].reverse().forEach((m) => {
      h += `<tr><td style="text-align:left">${m.label}</td><td class="green">${brl(m.receita)}</td><td class="red">${brl(m.despesa)}</td>`;
      h += `<td class="bold" style="color:${m.saldo >= 0 ? C.green : C.red}">${brl(m.saldo)}</td>`;
      h += `<td class="bold" style="color:${m.taxaPoupanca === null ? C.inkSoft : m.taxaPoupanca >= 0 ? C.green : C.red}">${m.taxaPoupanca === null ? "—" : m.taxaPoupanca.toFixed(1) + "%"}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

// ---------- Categorias: distribuição % num mês escolhido ----------
function reportCategorias() {
  const historico = mesesComDados();
  if (!state.reportCatMonth || !historico.some((m) => m.key === state.reportCatMonth)) {
    state.reportCatMonth = historico.length ? historico[historico.length - 1].key : null;
  }
  const tipo = state.reportCatTipo === "receita" ? "receita" : "despesa";
  let h = `<p class="panel-title">Distribuição por categoria</p>`;
  if (!state.reportCatMonth) return h + `<p class="hint">Ainda não há lançamentos reais.</p>`;
  h += `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">`;
  h += `<label class="field-label" style="max-width:220px;margin:0;">Mês<select class="field" id="report-cat-month">`;
  historico.forEach((m) => { h += `<option value="${m.key}" ${state.reportCatMonth === m.key ? "selected" : ""}>${m.label}</option>`; });
  h += `</select></label><div>`;
  [["despesa", "📉 Despesas"], ["receita", "📈 Receitas"]].forEach(([v, l]) => { h += `<button class="btn ${tipo === v ? "btn-primary" : "btn-outline"}" style="font-size:12px;padding:6px 12px;margin-right:4px;" data-action="set-cat-tipo" data-value="${v}">${l}</button>`; });
  h += `</div></div>`;

  const [y, mo] = state.reportCatMonth.split("-").map(Number);
  const tx = transactionsInPeriod(state.transactions, y, mo - 1).filter((t) => t.type === tipo);
  const porCat = {};
  tx.forEach((t) => { porCat[t.categoryId] = (porCat[t.categoryId] || 0) + Number(t.value); });
  const itens = Object.entries(porCat).map(([catId, val]) => { const cat = catById(catId); return { nome: cat ? cat.name : "Outros", cor: cat ? cat.color : "#94A3B8", val }; });
  if (itens.length === 0) return h + `<p class="hint">Sem ${tipo === "despesa" ? "despesas" : "receitas"} nesse mês.</p>`;
  h += `<div class="chart-box">${donutChart(itens, tipo === "despesa" ? "Total de despesas" : "Total de receitas")}</div>`;

  // comparação com os meses anteriores (barras empilhadas por categoria)
  const idx = historico.findIndex((m) => m.key === state.reportCatMonth);
  const janela = historico.slice(Math.max(0, idx - 5), idx + 1);
  if (janela.length >= 2) {
    const totaisCat = {};
    const dadosMes = janela.map((m) => {
      const [yy, mm] = m.key.split("-").map(Number);
      const por = {};
      transactionsInPeriod(state.transactions, yy, mm - 1).filter((t) => t.type === tipo).forEach((t) => { por[t.categoryId] = (por[t.categoryId] || 0) + Number(t.value); totaisCat[t.categoryId] = (totaisCat[t.categoryId] || 0) + Number(t.value); });
      return { label: m.label, por };
    });
    const top = Object.entries(totaisCat).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => id);
    const series = top.map((id) => { const c = catById(id); return { nome: c ? c.name : "Outros", cor: c ? c.color : "#94A3B8" }; });
    series.push({ nome: "Demais", cor: "#94A3B8" });
    const data = dadosMes.map((m) => { const vals = top.map((id) => m.por[id] || 0); vals.push(Object.entries(m.por).filter(([id]) => !top.includes(id)).reduce((s, [, v]) => s + v, 0)); return { label: m.label, vals }; });
    if (!data.some((d) => d.vals[d.vals.length - 1] > 0)) { series.pop(); data.forEach((d) => d.vals.pop()); }
    h += `<div class="chart-box"><p class="panel-title" style="margin-top:0;">Evolução por categoria (até 6 meses)</p>${chartLegend(series)}${svgStackedBars(data, series)}</div>`;
  }
  return h;
}

// ---------- Metas: hall da vergonha (estouros) e metas folgadas, acumulado em todos os meses ----------
function reportMetas() {
  const historico = mesesComDados();
  const acumulado = {};
  historico.forEach((pm) => {
    const mc = getMonthComparison(pm.year, pm.month);
    mc.rows.filter((r) => r.lancado).forEach((r) => {
      const k = r.description;
      if (!acumulado[k]) acumulado[k] = { description: r.description, type: r.type, meta: 0, real: 0, meses: 0 };
      acumulado[k].meta += r.value; acumulado[k].real += r.realizado; acumulado[k].meses += 1;
    });
  });
  const lista = Object.values(acumulado).map((x) => ({ ...x, diff: x.real - x.meta, diffPct: x.meta > 0 ? ((x.real - x.meta) / x.meta) * 100 : 0 }));
  const estouros = [...lista].filter((x) => x.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 10);
  const folgadas = [...lista].filter((x) => x.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 10);

  const graf = (tipo, titulo) => {
    const it = lista.filter((x) => x.type === tipo).sort((a, b) => b.meta - a.meta).slice(0, 10).map((x) => ({ nome: x.description, plan: x.meta, real: x.real }));
    return it.length ? `<div class="chart-box"><p class="panel-title" style="margin-top:0;">${titulo}</p>${pairedBars(it, tipo)}</div>` : "";
  };
  let h = graf("despesa", "Despesas — projetado × realizado (acumulado, 10 maiores)") + graf("receita", "Receitas — projetado × realizado (acumulado)") + `<p class="panel-title">🚨 Hall da vergonha — metas que mais estouram (acumulado)</p>`;
  if (estouros.length === 0) h += `<p class="hint">Nenhuma meta estourou até agora. 🎉</p>`;
  else {
    h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Meta</th><th>Meses</th><th>Planejado (soma)</th><th>Realizado (soma)</th><th>Diferença</th></tr></thead><tbody>`;
    estouros.forEach((x) => {
      h += `<tr><td style="text-align:left">${esc(x.description)}</td><td>${x.meses}</td><td class="muted">${brl(x.meta)}</td><td>${brl(x.real)}</td><td class="bold red">+${brl(x.diff)} (${x.diffPct.toFixed(0)}%)</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }

  h += `<p class="panel-title" style="margin-top:22px;">✅ Metas folgadas — sobram sempre</p>`;
  if (folgadas.length === 0) h += `<p class="hint">Nenhuma meta com folga relevante ainda.</p>`;
  else {
    h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Meta</th><th>Meses</th><th>Planejado (soma)</th><th>Realizado (soma)</th><th>Diferença</th></tr></thead><tbody>`;
    folgadas.forEach((x) => {
      h += `<tr><td style="text-align:left">${esc(x.description)}</td><td>${x.meses}</td><td class="muted">${brl(x.meta)}</td><td>${brl(x.real)}</td><td class="bold green">${brl(x.diff)} (${x.diffPct.toFixed(0)}%)</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

// ---------- Calendário de faturas: próximos vencimentos de cartão ----------
// ---------- Calendário diário: lançamentos reais dia a dia + projeção com pendências ----------
function reportCalendario() {
  if (!state.reportCalMonth) {
    const hoje = new Date();
    state.reportCalMonth = `${hoje.getFullYear()}-${pad2(hoje.getMonth() + 1)}`;
  }
  const [y, mo] = state.reportCalMonth.split("-").map(Number);
  const month = mo - 1;
  const { start, end } = getPeriodBounds(y, month);
  const todayStr = localTodayISO();

  let h = `<p class="panel-title">📅 Calendário do mês</p>`;
  h += `<label class="field-label" style="max-width:220px;margin-bottom:14px;">Mês<select class="field" id="report-cal-month">`;
  getPlannerMonths().forEach((pm) => { h += `<option value="${pm.key}" ${state.reportCalMonth === pm.key ? "selected" : ""}>${pm.label}</option>`; });
  h += `</select></label>`;
  h += `<p class="hint" style="margin-top:-6px;">Aqui a data que conta é a de <strong>caixa</strong> (vencimento da fatura, pro cartão) — por isso o saldo pode diferir um pouco do "Planejado × Realizado", que usa a data da compra.</p>`;

  // Saldo real (oficial, desde 27/08) acumulado até o dia anterior ao início deste período.
  const antes = state.transactions.filter((t) => cashKey(t) >= "2026-08-27" && cashKey(t) < start);
  let saldo = antes.length ? computeRunningBalance(antes).slice(-1)[0].balance : 0;

  const porDia = {};
  state.transactions.forEach((t) => {
    const k = cashKey(t);
    if (k >= start && k <= end) (porDia[k] = porDia[k] || []).push(t);
  });

  const linhas = [];
  let menorSaldo = saldo, diaMenorSaldo = null;
  for (let d = start; d <= end; d = addDaysToDate(d, 1)) {
    const itens = (porDia[d] || []).slice().sort((a, b) => (b.type === "receita") - (a.type === "receita"));
    if (itens.length > 0) {
      const net = itens.reduce((s, t) => s + (t.type === "receita" ? Number(t.value) : -Number(t.value)), 0);
      saldo += net;
      linhas.push({ dia: d, itens, saldo });
      if (saldo < menorSaldo) { menorSaldo = saldo; diaMenorSaldo = d; }
    }
  }

  h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Dia</th><th style="text-align:left">Lançamentos</th><th>Saldo acumulado</th></tr></thead><tbody>`;
  if (linhas.length === 0) {
    h += `<tr><td colspan="3" class="muted" style="text-align:center;padding:14px;">Nenhum lançamento real neste mês ainda.</td></tr>`;
  }
  linhas.forEach((l) => {
    const [ly, lm, ld] = l.dia.split("-").map(Number);
    const dow = DIAS_SEMANA[new Date(ly, lm - 1, ld).getDay()];
    const isHoje = l.dia === todayStr;
    h += `<tr style="${isHoje ? "background:var(--brass-bg);" : ""}"><td style="text-align:left;white-space:nowrap;">${pad2(ld)}/${pad2(lm)} <span class="muted">(${dow})</span>${isHoje ? ` <span class="badge" style="background:var(--brass-text);">hoje</span>` : ""}</td>`;
    h += `<td style="text-align:left;">`;
    h += l.itens.map((t) => {
      const cartao = state.cartoes.find((c) => c.id === t.cartaoId);
      return `<div>${esc(t.description)}${cartao ? ` <span class="muted">(${esc(cartao.nome)})</span>` : ""} <span style="color:${t.type === "receita" ? C.green : C.red}">${t.type === "receita" ? "+" : "-"}${brl(t.value)}</span></div>`;
    }).join("");
    h += `</td>`;
    h += `<td class="bold" style="color:${l.saldo >= 0 ? C.green : C.red}">${brl(l.saldo)}${l.dia === diaMenorSaldo && menorSaldo < 0 ? " ⚠️" : ""}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // Projeção com o que ainda falta acontecer no mês (reaproveita a mesma lógica prudente do planejamento)
  const mc = getMonthComparison(y, month);
  const saldoFinalReal = linhas.length ? linhas[linhas.length - 1].saldo : saldo;
  const saldoProjetado = saldoFinalReal + mc.aReceber - mc.aPagar;

  h += `<div class="panel" style="margin-top:16px;background:${saldoProjetado >= 0 ? "var(--ok-bg)" : "var(--danger-bg)"};border-color:${saldoProjetado >= 0 ? C.green : C.red};">`;
  h += `<p class="panel-title">🔮 Projeção com o que ainda falta neste mês</p>`;
  h += `<p class="hint" style="margin-top:0;">Saldo real até agora (${brl(saldoFinalReal)}) + a receber pendente (${brl(mc.aReceber)}) − a pagar pendente (${brl(mc.aPagar)})</p>`;
  h += `<p class="kpi-value" style="color:${saldoProjetado >= 0 ? C.green : C.red};font-size:26px;margin:6px 0;">${brl(saldoProjetado)}</p>`;
  if (saldoProjetado < 0) {
    h += `<p class="bold" style="color:${C.red};margin:8px 0 0;">💸 Nesse ritmo, pode faltar dinheiro este mês — considere adiantar receita, usar a reserva, ou rever despesas pendentes.</p>`;
  } else if (diaMenorSaldo && menorSaldo < 0) {
    h += `<p class="bold" style="color:${C.brass};margin:8px 0 0;">⚠️ O saldo chegou a ficar negativo no dia ${diaMenorSaldo.slice(8, 10)}/${diaMenorSaldo.slice(5, 7)} antes de se recuperar — fique de olho no fluxo de caixa perto dessa data.</p>`;
  } else {
    h += `<p class="hint" style="margin:8px 0 0;">Com o que já está confirmado e o que falta lançar, o mês deve fechar no azul.</p>`;
  }
  h += `</div>`;
  return h;
}

function reportCartao() {
  const todayStr = localTodayISO();
  const reais = state.transactions.filter((t) => t.isCartao && t.dueDate);
  // parcelas já assumidas e ainda não lançadas entram como "previstas" na fatura do mês delas
  const previstas = [];
  (state.parcelados || []).forEach((pc) => {
    for (let num = pc.numAtual; num <= pc.total; num++) {
      if (parcelaTxs(pc, num).length) continue;
      previstas.push({ id: `prev-${pc.id}-${num}`, description: `${pc.descricao} (parcela ${num}/${pc.total})`, value: pc.valor, cartaoId: pc.cartaoId, dueDate: parcelaDueDate(pc, parcelaMonthKey(pc, num)), previsto: true });
    }
  });
  const compras = [...reais, ...previstas];
  if (compras.length === 0) return `<p class="panel-title">💳 Faturas</p><p class="hint">Nenhuma compra no cartão lançada ainda.</p>`;
  const porVenc = {};
  compras.forEach((t) => { (porVenc[t.dueDate] = porVenc[t.dueDate] || []).push(t); });
  const datas = Object.keys(porVenc).sort();
  const futuras = datas.filter((d) => d >= todayStr);
  const passadas = datas.filter((d) => d < todayStr);

  const bloco = (titulo, lista) => {
    if (lista.length === 0) return "";
    let h = `<p class="panel-title" style="margin-top:18px;">${titulo}</p>`;
    lista.forEach((d) => {
      const itens = porVenc[d];
      const total = itens.reduce((s, t) => s + Number(t.value), 0);
      const prevTotal = itens.filter((t) => t.previsto).reduce((s, t) => s + Number(t.value), 0);
      h += `<div class="panel" style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;"><strong>${new Date(d + "T00:00:00").toLocaleDateString("pt-BR")}</strong><span class="bold red">${prevTotal > 0 ? `<span class="muted" style="font-weight:400;font-size:11px;">inclui ${brl(prevTotal)} previstos · </span>` : ""}${brl(total)}</span></div>`;
      itens.forEach((t) => {
        const cartao = state.cartoes.find((c) => c.id === t.cartaoId);
        h += `<div class="naoprevisto-row"><span>${cartao ? `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${cartao.cor};margin-right:5px;"></span>` : ""}${esc(t.description)}${t.previsto ? ` <span class="badge" style="background:${d < todayStr ? "var(--red)" : "var(--badge-brass)"}">${d < todayStr ? "sem lançamento" : "previsto"}</span>` : ""} ${cartao ? `<span class="muted">(${esc(cartao.nome)})</span>` : ""}</span><span class="red">${brl(t.value)}</span></div>`;
      });
      h += `</div>`;
    });
    return h;
  };
  return `<p class="panel-title">💳 Calendário de faturas</p>` + bloco("📅 Próximas", futuras) + bloco("🕓 Já venceram", passadas.reverse());
}

// ---------- Evolução do saldo acumulado (gráfico de barras em CSS) ----------
function reportEvolucao() {
  const oficialTx = state.transactions.filter((t) => cashKey(t) >= "2026-08-27");
  const bal = computeRunningBalance(oficialTx);
  const porMes = {};
  bal.forEach((t) => { porMes[cashKey(t).slice(0, 7)] = t.balance; });
  const chaves = Object.keys(porMes).sort();
  if (chaves.length === 0) return `<p class="panel-title">📈 Evolução do saldo</p><p class="hint">Ainda sem lançamentos reais.</p>`;
  let h = `<p class="panel-title">📈 Evolução do saldo acumulado (fim de cada mês)</p>`;
  h += `<div class="chart-box">${svgLine(chaves.map((k) => { const [yy, mm] = k.split("-").map(Number); return { label: `${MESES[mm - 1]}/${String(yy).slice(2)}`, v: porMes[k] }; }))}</div>`;
  h += `<div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th style="text-align:left">Mês</th><th>Saldo acumulado</th></tr></thead><tbody>`;
  [...chaves].reverse().forEach((k) => { h += `<tr><td style="text-align:left">${monthLabel(k)}</td><td class="bold" style="color:${porMes[k] >= 0 ? C.green : C.red}">${brl(porMes[k])}</td></tr>`; });
  h += `</tbody></table></div>`;
  return h;
}

// ---------- Bichos: quanto cada um custou (despesas etiquetadas, a partir de nov/2026) ----------
function reportBichos() {
  let h = `<p class="panel-title">🐾 Gastos por bicho</p>`;
  if (state.bichos.length === 0) return h + `<p class="hint">Cadastre os bichos em <strong>Planejamento → ⚙️ Configurar → 🐾 Bichos</strong> e etiquete os lançamentos a partir de novembro/2026.</p>`;
  h += `<p class="hint" style="margin-top:0;">Considera só despesas etiquetadas a partir de 01/11/2026. Quando há mais de um bicho no lançamento, o valor é dividido igualmente.</p>`;
  const meses = getPlannerMonths().filter((pm) => pm.key >= ETIQUETA_INICIO.slice(0, 7));
  const porMes = meses.map((pm) => {
    const tx = transactionsInPeriod(state.transactions, pm.year, pm.month);
    const tot = {}; const semEtiqueta = { val: 0 };
    tx.filter((t) => t.type === "despesa").forEach((t) => {
      const partes = partesPorBicho(t);
      if (partes.length === 0) { return; }
      partes.forEach((x) => { tot[x.bichoId] = (tot[x.bichoId] || 0) + x.parte; });
    });
    return { ...pm, tot, total: Object.values(tot).reduce((s, v) => s + v, 0), tx };
  });
  const comDados = porMes.filter((m) => m.total > 0);
  if (comDados.length === 0) return h + `<p class="hint">Ainda não há despesas etiquetadas com bichos.</p>`;

  // acumulado
  const acum = {}; comDados.forEach((m) => Object.entries(m.tot).forEach(([id, v]) => { acum[id] = (acum[id] || 0) + v; }));
  const acumLinhas = Object.entries(acum).map(([id, v]) => ({ b: bichoById(id), v })).filter((x) => x.b).sort((a, b) => b.v - a.v);
  const totalAcum = acumLinhas.reduce((s, x) => s + x.v, 0);
  h += `<p class="panel-title" style="margin-top:14px;">Acumulado desde novembro/2026 — ${brl(totalAcum)}</p>`;
  acumLinhas.forEach((x) => {
    const pct = totalAcum > 0 ? (x.v / totalAcum) * 100 : 0;
    h += `<div class="bar-chart-row"><span class="bar-chart-label">${esc(x.b.nome)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${Math.max(2, pct)}%;background:${x.b.cor}"></span></span><span class="bar-chart-value">${brl(x.v)} (${pct.toFixed(0)}%)</span></div>`;
  });

  // por mês
  const ids = acumLinhas.map((x) => x.b.id);
  if (comDados.length >= 1) {
    const ser = acumLinhas.map((x) => ({ nome: x.b.nome, cor: x.b.cor }));
    h += `<div class="chart-box" style="margin-top:14px;"><p class="panel-title" style="margin-top:0;">Gasto por mês, por bicho</p>${chartLegend(ser)}${svgStackedBars(comDados.map((m) => ({ label: m.label, vals: acumLinhas.map((x) => m.tot[x.b.id] || 0) })), ser)}</div>`;
  }
  h += `<p class="panel-title" style="margin-top:20px;">Mês a mês</p>`;
  h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Mês</th>${ids.map((id) => `<th>${esc(bichoById(id).nome)}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  [...comDados].reverse().forEach((m) => {
    h += `<tr><td style="text-align:left">${m.label}</td>${ids.map((id) => `<td>${m.tot[id] ? brl(m.tot[id]) : "—"}</td>`).join("")}<td class="bold red">${brl(m.total)}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // detalhe: lançamentos de um mês (e de um bicho)
  if (!state.reportBichoMonth || !comDados.some((m) => m.key === state.reportBichoMonth)) state.reportBichoMonth = comDados[comDados.length - 1].key;
  h += `<p class="panel-title" style="margin-top:20px;">Detalhe dos lançamentos</p>`;
  h += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">`;
  h += `<label class="field-label" style="max-width:200px;">Mês<select class="field" id="report-bicho-month">${comDados.map((m) => `<option value="${m.key}" ${state.reportBichoMonth === m.key ? "selected" : ""}>${m.label}</option>`).join("")}</select></label>`;
  h += `<label class="field-label" style="max-width:200px;">Bicho<select class="field" id="report-bicho-sel"><option value="todos">Todos</option>${state.bichos.map((b) => `<option value="${b.id}" ${state.reportBichoSel === b.id ? "selected" : ""}>${esc(b.nome)}</option>`).join("")}</select></label></div>`;
  const mSel = comDados.find((m) => m.key === state.reportBichoMonth);
  const linhas = [];
  mSel.tx.filter((t) => t.type === "despesa").forEach((t) => {
    partesPorBicho(t).forEach((x) => { if (state.reportBichoSel === "todos" || state.reportBichoSel === x.bichoId) linhas.push({ t, x }); });
  });
  linhas.sort((a, b) => a.t.date.localeCompare(b.t.date));
  if (linhas.length === 0) h += `<p class="hint">Nenhum lançamento para essa seleção.</p>`;
  else {
    h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Data</th><th style="text-align:left">Descrição</th><th style="text-align:left">Bicho</th><th>Valor do lançamento</th><th>Parte do bicho</th></tr></thead><tbody>`;
    linhas.forEach(({ t, x }) => {
      const b = bichoById(x.bichoId);
      h += `<tr><td style="text-align:left">${new Date(t.date + "T00:00:00").toLocaleDateString("pt-BR")}</td><td style="text-align:left">${esc(t.description)}</td><td style="text-align:left"><span class="bicho-tag" style="--bc:${esc(b.cor)}">${esc(b.nome)}</span></td><td class="muted">${brl(t.value)}</td><td class="bold red">${brl(x.parte)}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

// ---------- Empréstimos consignados + Reserva pra quitação ----------
function reportEmprestimos() {
  const totalDevedor = totalSaldoDevedorEmprestimos();
  const reserva = totalReserva();
  const pct = totalDevedor > 0 ? Math.min(100, (reserva / totalDevedor) * 100) : 0;

  let h = `<p class="panel-title">🏦 Empréstimos consignados</p>`;
  h += `<p class="hint" style="margin-top:0;">Fica fora do planejamento mensal de propósito — lance seu salário já líquido (depois do desconto) nas metas. Aqui é só pra acompanhar o saldo devedor derretendo mês a mês.</p>`;
  if (state.loans.length === 0) {
    h += `<p class="hint">Nenhum empréstimo cadastrado ainda.</p>`;
  } else {
    state.loans.forEach((l) => {
      const pagamentos = l.pagamentos || [];
      const saldo = saldoDevedorLoan(l);
      const pctPago = l.parcelasTotais > 0 ? (pagamentos.length / l.parcelasTotais) * 100 : 0;
      if (!newPagamento[l.id]) newPagamento[l.id] = { date: localTodayISO(), valor: String(l.parcela) };
      const np = newPagamento[l.id];
      const temManual = l.saldoDevedorManual !== null && l.saldoDevedorManual !== undefined;
      h += `<div class="panel" style="margin-bottom:10px;">`;
      h += `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><strong>${esc(l.nome)}</strong><span class="bold red">${brl(saldo)} devendo</span></div>`;
      if (l.valorContratado || l.dataInicio) {
        h += `<p class="hint" style="margin:0 0 4px;">Contratado ${l.valorContratado ? brl(l.valorContratado) : ""}${l.dataInicio ? ` em ${new Date(l.dataInicio + "T00:00:00").toLocaleDateString("pt-BR")}` : ""}</p>`;
      }
      h += `<p class="hint" style="margin:4px 0 8px;">Parcela ${brl(l.parcela)} · ${pagamentos.length}/${l.parcelasTotais} pagas · `;
      h += `taxa <input type="number" step="0.01" min="0" class="note-input" style="width:60px;display:inline-block;" data-action="edit-loan-taxa" data-id="${l.id}" value="${l.taxaJurosMensal || 0}" />% a.m.</p>`;
      h += `<div class="progress-track"><div class="progress-fill" style="width:${pctPago}%;background:${C.green};"></div></div>`;
      h += `<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">`;
      h += `<label class="field-label" style="margin:0;">Saldo devedor<input type="number" step="0.01" class="note-input" style="width:110px;" data-action="edit-loan-saldo-manual" data-id="${l.id}" value="${saldo.toFixed(2)}" /></label>`;
      const novosPg = temManual ? pagamentosDesdeSnapshot(l).length : 0;
      h += temManual
        ? `<span class="badge" style="background:var(--badge-green);" title="Parte do valor digitado por você, conferido no app do banco, e abate cada pagamento lançado depois dele">📌 ${novosPg > 0 ? `saldo do banco − ${novosPg} pagamento(s) lançado(s) desde então` : "valor real do banco"}</span><button class="del-btn" data-action="limpar-saldo-manual-loan" data-id="${l.id}" title="Voltar a estimar pela fórmula">🔄 estimar de novo</button>`
        : `<span class="muted" style="font-size:11px;">📐 estimado pela fórmula — digite o valor do app do banco acima pra ficar exato</span>`;
      h += `</div>`;

      if (pagamentos.length > 0) {
        h += `<div style="margin-top:8px;">`;
        [...pagamentos].sort((a, b) => b.date.localeCompare(a.date)).forEach((pg) => {
          h += `<div class="naoprevisto-row"><span>${new Date(pg.date + "T00:00:00").toLocaleDateString("pt-BR")}</span><span style="display:flex;align-items:center;gap:8px;"><span class="green">${brl(pg.valor)}</span><button class="del-btn" data-action="del-pagamento-loan" data-loanid="${l.id}" data-id="${pg.id}" title="Excluir">🗑️</button></span></div>`;
        });
        h += `</div>`;
      }

      h += `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end;">`;
      h += `<label class="field-label" style="margin:0;">Data do pagamento<input type="date" class="field" style="padding:6px;" data-action="np-date" data-loanid="${l.id}" value="${np.date}" /></label>`;
      h += `<label class="field-label" style="margin:0;">Valor pago<input type="number" step="0.01" class="field" style="padding:6px;width:100px;" data-action="np-valor" data-loanid="${l.id}" value="${np.valor}" /></label>`;
      h += `<button class="btn btn-outline" style="font-size:11px;padding:7px 10px;" data-action="registrar-pagamento-loan" data-id="${l.id}" ${pagamentos.length >= l.parcelasTotais ? "disabled" : ""}>✓ Registrar pagamento</button>`;
      h += `<button class="del-btn" data-action="del-loan" data-id="${l.id}" title="Excluir empréstimo">🗑️</button>`;
      h += `</div></div>`;
    });
  }
  h += `<form class="grid cols-6-md" id="loan-form" style="margin-top:10px;">`;
  h += `<input type="text" class="field span-2" id="newloan-nome" placeholder="Nome do empréstimo" value="${esc(newLoan.nome)}" />`;
  h += `<input type="number" step="0.01" class="field span-1" id="newloan-parcela" placeholder="Parcela R$" value="${newLoan.parcela}" />`;
  h += `<input type="number" class="field span-1" id="newloan-totais" placeholder="Nº parcelas" value="${newLoan.parcelasTotais}" />`;
  h += `<input type="number" step="0.01" class="field span-1" id="newloan-taxa" placeholder="Taxa % a.m." value="${newLoan.taxaJurosMensal}" />`;
  h += `<button type="submit" class="btn btn-primary span-1">Adicionar</button>`;
  h += `<p class="hint span-6" style="margin:2px 0 0;">A taxa de juros mensal é usada pra estimar o saldo devedor restante (Tabela Price) conforme você vai registrando os pagamentos — não precisa saber o valor total do contrato.</p>`;
  h += `</form>`;

  h += `<p class="panel-title" style="margin-top:26px;">💰 Reserva pra quitação antecipada</p>`;
  h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px;">`;
  h += `<div class="kpi-card"><p class="kpi-label">Reservado até agora</p><p class="kpi-value green">${brl(reserva)}</p></div>`;
  h += `<div class="kpi-card"><p class="kpi-label">Saldo devedor total</p><p class="kpi-value red">${brl(totalDevedor)}</p></div>`;
  h += `<div class="kpi-card"><p class="kpi-label">Cobertura</p><p class="kpi-value" style="color:${C.cover}">${pct.toFixed(0)}%</p><div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${pct}%;background:${C.brass};"></div></div></div>`;
  h += `</div>`;

  if (state.reservaAportes.length > 0) {
    h += `<div class="table-wrap"><table><thead><tr><th style="text-align:left">Data</th><th style="text-align:left">Nota</th><th>Valor</th><th></th></tr></thead><tbody>`;
    [...state.reservaAportes].sort((a, b) => b.date.localeCompare(a.date)).forEach((a) => {
      h += `<tr><td style="text-align:left">${new Date(a.date + "T00:00:00").toLocaleDateString("pt-BR")}</td><td style="text-align:left">${esc(a.nota || "—")}</td><td class="green">${brl(a.valor)}</td><td><button class="del-btn" data-action="del-aporte" data-id="${a.id}">🗑️</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  h += `<form class="grid cols-6-md" id="aporte-form" style="margin-top:10px;">`;
  h += `<input type="date" class="field span-2" id="newaporte-date" value="${newAporte.date}" />`;
  h += `<input type="number" step="0.01" class="field span-1" id="newaporte-valor" placeholder="Valor" value="${newAporte.valor}" />`;
  h += `<input type="text" class="field span-2" id="newaporte-nota" placeholder="Nota (opcional)" value="${esc(newAporte.nota)}" />`;
  h += `<button type="submit" class="btn btn-primary span-1">Guardar</button>`;
  h += `</form>`;
  return h;
}

function render() {
  const app = document.getElementById("app");
  if (state.loading) { app.innerHTML = '<div class="loading">Abrindo o livro-caixa...</div>'; return; }

  const withBalance = getWithRunningBalance();
  const visibleTx = getVisibleTransactions(withBalance);
  const catBreakdown = getCategoryBreakdown(withBalance, "despesa");
  const catBreakdownReceita = getCategoryBreakdown(withBalance, "receita");
  const plannerData = getPlannerData(withBalance);
  const monthComparison = getMonthComparison();
  const prevTotals = getPrevMonthTotals();
  // Saldo geral "oficial": ignora tudo antes de 27/08/2026 (início oficial do sistema) e começa do zero.
  const oficialTx = state.transactions.filter((t) => cashKey(t) >= "2026-08-27");
  const oficialBalance = computeRunningBalance(oficialTx);
  // Limita ao fim do período selecionado — não deixa lançamentos de cartão já feitos pra um mês
  // futuro "roubarem" saldo do mês atual. Na visão ANO, vai até 31/12 do ano selecionado.
  const limiteSaldoGeral = state.showAll ? `${state.selectedYear}-12-31` : getPeriodBounds(state.selectedYear, state.selectedMonth).end;
  const oficialBalanceAteLimite = oficialBalance.filter((t) => cashKey(t) <= limiteSaldoGeral);
  const saldoGeral = oficialBalanceAteLimite.length ? oficialBalanceAteLimite[oficialBalanceAteLimite.length - 1].balance : 0;
  const monthTotals = (() => {
    if (monthComparison) {
      return {
        receitas: monthComparison.totalRealizadoReceita,
        despesas: monthComparison.totalRealizadoDespesa,
        saldo: monthComparison.totalRealizadoReceita - monthComparison.totalRealizadoDespesa,
      };
    }
    const receitas = withBalance.filter((t) => t.type === "receita").reduce((s, t) => s + Number(t.value), 0);
    const despesas = withBalance.filter((t) => t.type === "despesa").reduce((s, t) => s + Number(t.value), 0);
    return { receitas, despesas, saldo: receitas - despesas };
  })();
  // Projeção de fechamento do mês selecionado: saldo projetado acumulado até o início do
  // período (encadeando o "Atualizado" de cada mês anterior, não só o que já foi lançado)
  // + o líquido projetado do próprio mês (previsto + não previsto + o que ainda falta).
  const projecaoMes = (() => {
    if (!monthComparison) return null;
    const saldoInicial = saldoInicioProjetado(state.selectedYear, state.selectedMonth);
    const liquidoMes = monthComparison.totalAtualizadoReceita - monthComparison.totalAtualizadoDespesa;
    return { saldoInicial, liquidoMes, saldoFinal: saldoInicial + liquidoMes };
  })();

  let html = "";
  html += `<div class="cover">${logoFull()}<div class="cover-right"><span class="cover-chip">Exercício 2026–2027</span><button class="cover-btn" data-action="toggle-theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">${iconSVG(effectiveTheme() === "dark" ? "sun" : "moon")}<span>${effectiveTheme() === "dark" ? "Claro" : "Escuro"}</span></button><button class="cover-btn" data-action="logout" title="Sair da conta">${iconSVG("logout")}<span>Sair</span></button></div></div>`;
  if (state.saveError) html += `<div class="save-error">Não foi possível salvar agora. Seus lançamentos podem se perder ao recarregar.</div>`;

  // Navegação principal: Planejamento (tela do dia a dia) x Relatórios (análises, sem misturar com o planejamento)
  html += `<div class="tab-nav">`;
  html += `<button class="tab-nav-btn ${state.activeTab === "planejamento" ? "active" : ""}" data-action="set-tab" data-tab="planejamento">📊 Planejamento</button>`;
  html += `<button class="tab-nav-btn ${state.activeTab === "relatorios" ? "active" : ""}" data-action="set-tab" data-tab="relatorios">📈 Relatórios</button>`;
  html += `</div>`;

  if (state.activeTab === "relatorios") {
    html += buildRelatoriosHTML(withBalance);
    app.innerHTML = html;
    attachListeners();
    return;
  }

  html += `<div class="body-panel">`;
  // Seletor de ano
  html += `<div class="year-row">`;
  [2026, 2027].forEach((y) => { html += `<button class="year-btn ${state.selectedYear === y ? "active" : ""}" data-action="set-year" data-year="${y}">${y}</button>`; });
  html += `</div>`;
  // Abas de mês
  html += `<div class="month-tabs">`;
  html += `<button class="month-tab ${state.showAll ? "active" : ""}" data-action="show-all">ANO</button>`;
  MESES.forEach((m, i) => { html += `<button class="month-tab ${!state.showAll && state.selectedMonth === i ? "active" : ""}" data-action="set-month" data-month="${i}">${m}</button>`; });
  html += `</div>`;

  html += `<div class="content">`;
  // Resumo + carimbo
  html += `<div class="summary-grid">`;
  html += `<div class="summary-cards">`;
  html += `<div class="card"><p class="label">📈 Receitas</p><p class="value green">${brl(monthTotals.receitas)}</p>${prevTotals ? deltaBadge(monthTotals.receitas, prevTotals.receitas, true) : ""}</div>`;
  html += `<div class="card"><p class="label">📉 Despesas</p><p class="value red">${brl(monthTotals.despesas)}</p>${prevTotals ? deltaBadge(monthTotals.despesas, prevTotals.despesas, false) : ""}</div>`;
  html += `<div class="card"><p class="label">Saldo do período</p><p class="value" style="color:${monthTotals.saldo >= 0 ? C.green : C.red}">${brl(monthTotals.saldo)}</p>${prevTotals ? `<span style="font-size:9px;color:${C.inkSoft};">vs ${brl(prevTotals.receitas - prevTotals.despesas)} em ${prevTotals.label}</span>` : ""}</div>`;
  html += `</div>`;
  html += `<div class="stamp-wrap"><div class="stamp" style="border-color:${saldoGeral >= 0 ? C.green : C.red}; color:${saldoGeral >= 0 ? C.green : C.red};">
    <span class="t1">Saldo financeiro — fim de ${state.showAll ? state.selectedYear : `${MESES[state.selectedMonth]}/${String(state.selectedYear).slice(2)}`}</span><span class="t2">${brl(saldoGeral)}</span><span class="t3">${saldoGeral >= 0 ? "positivo" : "negativo"}</span></div></div>`;
  html += `</div>`;

  // Saldo projetado até o fim do mês: já realizado (previsto + não previsto) + o que falta do planejado
  if (projecaoMes) {
    html += `<div class="panel brass" style="margin-bottom:16px;">`;
    html += `<p class="panel-title">💰 Saldo projetado — fim de ${MESES[state.selectedMonth]}/${String(state.selectedYear).slice(2)}</p>`;
    html += `<div class="summary-cards">`;
    html += `<div class="card"><p class="label">Saldo inicial projetado</p><p class="value" style="color:${projecaoMes.saldoInicial >= 0 ? C.green : C.red}">${brl(projecaoMes.saldoInicial)}</p></div>`;
    html += `<div class="card"><p class="label">Líquido do mês (realizado + a realizar)</p><p class="value" style="color:${projecaoMes.liquidoMes >= 0 ? C.green : C.red}">${projecaoMes.liquidoMes >= 0 ? "+" : ""}${brl(projecaoMes.liquidoMes)}</p></div>`;
    html += `<div class="card" style="border-color:${C.brass};border-width:2px;"><p class="label brass-text">Saldo final projetado</p><p class="value bold" style="color:${projecaoMes.saldoFinal >= 0 ? C.green : C.red};font-size:17px;">${brl(projecaoMes.saldoFinal)}</p></div>`;
    html += `</div>`;
    html += `<details class="more"><summary>ⓘ como é calculado</summary><p class="hint" style="margin:8px 0 0;">O saldo inicial já é projetado, não só o realizado: encadeia a "Previsão do mês" de cada mês anterior desde setembro/2026, então se um mês passado ainda tiver contas em aberto, isso já reflete aqui. O líquido do mês soma o que já entrou/saiu (inclusive não previstos) com o que ainda está planejado e não foi lançado.</p></details>`;
    html += `</div>`;
  }

  // Áreas: Projeções (planejado x realizado, por meta) e Lançamentos (o que de fato aconteceu)
  html += `<div class="area-nav">`;
  html += `<button class="area-btn ${state.area === "projecoes" ? "active" : ""}" data-action="set-area" data-area="projecoes">🎯 Projeções<small>metas × realizado</small></button>`;
  html += `<button class="area-btn ${state.area === "lancamentos" ? "active" : ""}" data-action="set-area" data-area="lancamentos">🧾 Lançamentos<small>o que já aconteceu</small></button>`;
  html += `</div>`;
  html += `<div class="toolbar">`;
  html += `<button class="btn btn-primary" data-action="toggle-form">➕ ${state.showForm ? "Fechar" : "Novo lançamento"}</button>`;
  html += `<span class="spacer"></span>`;
  html += `<button class="btn btn-outline" data-action="toggle-cfg">⚙️ Configurar ${state.showCfg ? "▴" : "▾"}</button>`;
  html += `</div>`;
  if (state.showCfg) {
    html += `<div class="cfg-panel">`;
    html += `<button class="btn btn-brass" data-action="toggle-goals">🎯 ${state.showGoalsManager ? "Fechar metas" : "Editar metas"}</button>`;
    html += `<button class="btn btn-outline" data-action="toggle-cat">🏷️ Categorias</button>`;
    html += `<button class="btn btn-outline" data-action="toggle-parc-manager">💳 ${state.showParcManager ? "Fechar parcelas" : "Parcelas"}</button>`;
    html += `<button class="btn btn-outline" data-action="toggle-bicho-manager">🐾 ${state.showBichoManager ? "Fechar bichos" : "Bichos"}</button>`;
    html += `<button class="btn btn-outline" data-action="toggle-card-manager">💳 ${state.showCardManager ? "Fechar cartões" : "Cartões"}</button>`;
    html += `<button class="btn btn-outline" data-action="export-backup">💾 Exportar backup</button>`;
    html += `<button class="btn btn-outline" data-action="import-backup">📂 Importar backup</button>`;
    html += `</div>`;
  }
  html += `<input type="file" id="import-file-input" accept="application/json" style="display:none" />`;

  // Formulário de lançamento
  if (state.showForm) {

    let bichosHtml = "";

      state.grupos.forEach((g) => { const gi = bichosValidos(g.bichoIds); const on = gi.length > 0 && gi.every((id) => sel.includes(id)); bichosHtml += `<button type="button" class="bicho-chip grupo ${on ? "on" : ""}" data-action="form-grupo" data-id="${g.id}">${esc(g.nome)}</button>`; });

      html += `<div class="kpi-row">`;
      html += `<div class="kpi-mini"><p class="l">Saldo realizado no mês</p><p class="v" style="color:${saldoReal >= 0 ? C.green : C.red}">${brl(saldoReal)}</p><p class="s">receitas − despesas já lançadas</p></div>`;
      html += `<div class="kpi-mini"><p class="l">A receber</p><p class="v green">${brl(monthComparison.aReceber)}</p><p class="s">falta entrar</p></div>`;

      html += `<div class="kpi-mini destaque"><p class="l brass-text">Previsão de fechamento</p><p class="v" style="color:${previsao >= 0 ? C.green : C.red}">${brl(previsao)}</p><p class="s">saldo realizado + a receber − a pagar</p></div>`;
