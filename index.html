<style>
  :root {
    --cover: #1E293B;

    --brass-bg: #FFFBEB;
    --brass-border: #FDE68A;
    --brass-text: #B45309;
    --ok-bg: #F0FDF4;

    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --control-h: 40px;
    --font: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --cover: #0E1A2E;
    --primary: #2C4166;
    --primary-ink: #FFFFFF;
    --paper: #111B2E;
    --paper-dark: #182740;
    --line: #26364F;
    --ink: #E8EEF7;
    --ink-soft: #9AA9C0;
    --red: #F27878;
    --green: #4CCB8A;
    --brass: #F2B450;
    --cream: #111B2E;
    --body-bg: #0A1120;
    --input-bg: #0A1120;
    --info-bg: #10233F;
    --brass-bg: #241C0C;
    --brass-border: #5E4A17;
    --brass-text: #F2B450;
    --ok-bg: #0F2A1D;
    --danger-bg: #34171A;
    --ring: rgba(154, 169, 192, 0.28);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --cover: #0E1A2E;
    --primary: #2C4166;
    --primary-ink: #FFFFFF;
    --paper: #111B2E;
    --paper-dark: #182740;
    --line: #26364F;
    --ink: #E8EEF7;
    --ink-soft: #9AA9C0;
    --red: #F27878;
    --green: #4CCB8A;
    --brass: #F2B450;
    --cream: #111B2E;
    --body-bg: #0A1120;
    --input-bg: #0A1120;
    --info-bg: #10233F;
    --brass-bg: #241C0C;
    --brass-border: #5E4A17;
    --brass-text: #F2B450;
    --ok-bg: #0F2A1D;
    --danger-bg: #34171A;
    --ring: rgba(154, 169, 192, 0.28);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--body-bg);
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 40px; }
  .cover {
    position: relative; overflow: hidden;
    background: var(--cover); color: #F8FAFC;
    border-radius: var(--radius-lg);
    padding: 18px 26px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .cover::after { content: ""; position: absolute; right: -40px; top: 0; bottom: 0; width: 46%; pointer-events: none;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 14px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 70%); mask-image: linear-gradient(90deg, transparent, #000 70%); }
  .value, .v, .t2, td, th, .bar-chart-value, .pb-value, .tx-side, .proj-stats b, .meta-nums, .donut-row, .kpi-value, .naoprevisto-row, .day-head { font-variant-numeric: tabular-nums; }
  .cover > * { position: relative; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo-symbol { width: 44px; height: 44px; flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #fff; font-variant-numeric: normal; }
  .brand-tag { font-size: 11.5px; color: #94A3B8; margin-top: 3px; letter-spacing: 0.01em; }
  .cover-right { display: flex; align-items: center; gap: 10px; }
  .cover-chip { font-size: 11px; font-weight: 500; color: #CBD5E1; padding: 5px 11px; border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; white-space: nowrap; }
  .cover-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #F8FAFC; border-radius: var(--radius-sm); padding: 6px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .cover-btn:hover { background: rgba(255,255,255,0.13); }
  .logo-symbol .lg-book { stroke: currentColor; }
  .logo-symbol .lg-bars { fill: var(--logo-bars); }
  .logo-symbol .lg-arrow { stroke: var(--logo-arrow); }
  .logo-mono .lg-bars { fill: currentColor; } .logo-mono .lg-arrow { stroke: currentColor; }
  .body-panel { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow-sm); overflow: hidden; }
  .save-error { background: var(--danger-bg); color: var(--red); padding: 10px 16px; font-size: 13px; border-radius: var(--radius-sm); margin: 10px 0 0; border: 1px solid var(--red); }

  .tab-nav { display: flex; gap: 6px; padding: 18px 0 14px; }
  .tab-nav-btn { font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
  .tab-nav-btn:hover { background: var(--paper-dark); color: var(--ink); }
  .tab-nav-btn.active { background: var(--primary); color: var(--primary-ink); box-shadow: var(--shadow-sm); }
  .report-nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px; border-bottom: 1px solid var(--line); }
  .report-nav-btn { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .report-nav-btn.active { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .report-nav-btn:hover:not(.active), .year-btn:hover:not(.active) { background: var(--paper-dark); color: var(--ink); }
  .kpi-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--paper); box-shadow: var(--shadow-sm); }
  .kpi-card .kpi-label { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; }
  .kpi-card .kpi-value { font-size: 22px; font-weight: 700; margin: 0; }
  .progress-track { height: 10px; border-radius: 6px; background: var(--paper-dark); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; }

  .year-row { display: flex; gap: 8px; padding: 12px 12px 0; }
  .year-btn { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .year-btn.active { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

  .month-tabs { display: flex; overflow-x: auto; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  .month-tab { font-size: 13px; padding: 8px 12px; border-radius: 6px 6px 0 0; background: transparent; border: none; color: var(--ink-soft); white-space: nowrap; cursor: pointer; font-family: inherit; }
  .month-tab { border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
  .month-tab:hover { color: var(--ink); }
  .month-tab.active { background: transparent; color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }

  .content { padding: 16px; }
  .summary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; align-items: stretch; }
  .summary-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .card .label { font-size: 11px; color: var(--ink-soft); margin: 0 0 4px; display:flex; align-items:center; gap:4px; font-weight: 500; }
  .card .value { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .stamp-wrap { display: flex; align-items: stretch; }
  .stamp {
    border-radius: var(--radius); width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center; padding: 14px 16px;
    border: 1px solid var(--line); background: var(--paper-dark);
  }
  .stamp .t1 { font-size: 11px; color: var(--ink-soft); font-weight: 500; }
  .stamp .t2 { font-family: inherit; font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; }
  .stamp .t3 { font-size: 10px; color: var(--ink-soft); margin-top: 4px; font-weight: 500; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .btn { font-size: 13px; font-weight: 500; min-height: 38px; padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s; }
  .btn:focus-visible, .cover-btn:focus-visible, .tab-nav-btn:focus-visible, .area-btn:focus-visible, .month-tab:focus-visible, .report-nav-btn:focus-visible, .year-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 600; }
  .btn-primary:hover, .btn-submit:hover { filter: brightness(1.12); }
  .btn-outline { background: var(--paper); border-color: var(--line); color: var(--ink); }
  .btn-outline:hover { background: var(--paper-dark); }
  .btn-brass { background: var(--brass-bg); border-color: var(--brass-border); color: var(--brass-text); }
  .btn-brass:hover { filter: brightness(0.97); }
  .btn-submit { background: var(--primary); color: var(--primary-ink); font-weight: 600; width: 100%; }

  .panel { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .panel.brass { border-color: var(--brass-border); background: var(--brass-bg); }
  .panel.brass .card { background: var(--paper); }
  .panel-title { font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 0 10px; letter-spacing: -0.005em; }
  .panel.brass .panel-title { color: var(--brass-text); }

  form.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  form.grid.cols-6-md { grid-template-columns: 1fr; }
  @media (min-width: 640px) { form.grid.cols-6-md { grid-template-columns: repeat(6, 1fr); } }
  .field { font-size: 13px; min-height: var(--control-h); padding: 8px 11px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--input-bg); color: var(--ink); font-family: inherit; width: 100%; transition: border-color .15s, box-shadow .15s; }
  .field::placeholder { color: var(--ink-soft); opacity: .8; }
  .field:hover { border-color: var(--ink-soft); }
  .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  .field[aria-invalid="true"], .field:user-invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12); }
  label.field-label { font-size: 11px; font-weight: 500; color: var(--ink-soft); display: block; }
  label.field-label .field { margin-top: 4px; }
  .span-1 { grid-column: span 1; } .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; }
  .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; color: #fff; display: inline-flex; align-items: center; gap: 5px; }
  .chip button { background: none; border: none; color: #fff; cursor: pointer; padding: 0; line-height: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead tr { border-bottom: 1px solid var(--line); color: var(--ink-soft); font-weight: 600; }
  tbody tr:hover { background: var(--paper-dark); }
  tbody tr, tfoot tr:first-child { border-bottom: 1px solid var(--line); }
  tfoot tr { border-top: none; }
  tfoot tr:first-of-type { border-top: 1px solid var(--ink); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 10px; color: #fff; display: inline-block; }
  .muted { color: var(--ink-soft); }
  .green { color: var(--green); } .red { color: var(--red); } .brass-text { color: var(--brass-text); }
  .bold { font-weight: 700; }
  .note-input { font-size: 11px; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--input-bg); color: var(--ink); width: 100%; font-family: inherit; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 2px; }
  .table-wrap { overflow-x: auto; }
  .naoprevisto-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }

  .charts-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .bar-chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .bar-chart-label { width: 100px; flex-shrink: 0; color: var(--ink-soft); text-align: right; }
  .bar-chart-track { display: block; flex: 1; background: var(--paper-dark); border-radius: 3px; height: 16px; position: relative; overflow: hidden; }
  .bar-chart-fill { display: block; height: 100%; min-width: 2px; border-radius: 3px; }
  .bar-chart-value { width: 90px; flex-shrink: 0; text-align: right; font-weight: 600; }
  .planner-bars { display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; padding-bottom: 4px; height: 160px; }
  .planner-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 34px; height: 100%; justify-content: flex-end; }
  .planner-col .bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; }
  .planner-col .bar { width: 12px; border-radius: 2px 2px 0 0; }
  .planner-col .lbl { font-size: 9px; color: var(--ink-soft); margin-top: 4px; white-space: nowrap; }
  .legend { display: flex; gap: 14px; font-size: 11px; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }


  /* ---- Parcelas no cartão ---- */
  .parc-section { border-top-color: var(--primary); }
  .parc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .parc-main { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; min-width: 0; }
  .parc-side { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .dot-cartao { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  /* ---- Gráficos ---- */
  .pb-label { width: 110px; } .pb-value { width: 175px; }
  @media (max-width: 600px) { .pb-label { width: 70px; } .pb-value { width: 92px; font-size: 10px; } .donut-wrap { justify-content: center; } }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--ink-soft); margin: 0 0 6px; }
  .chart-legend i, .donut-row i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .donut-wrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin: 8px 0 14px; }
  .donut-legend { flex: 1; min-width: 220px; }
  .donut-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .chart-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--paper); margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  /* ---- Ícones ---- */
  .ic { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: .2em; }
  .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .del-btn .ic { margin-right: 0; }
  .area-btn .ic { width: 1.2em; height: 1.2em; }
  .day-head { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 4px 4px; margin-top: 6px; border-bottom: 1px solid var(--line); color: var(--ink-soft); }
  .tx-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .tx-main { min-width: 0; } .tx-sub { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tx-side { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
  /* ---- Bichos ---- */
  .bicho-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: var(--bc); border: 1px solid var(--bc); white-space: nowrap; }
  .bicho-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--bc, var(--line)); background: transparent; color: var(--ink); cursor: pointer; font-family: inherit; }
  .bicho-chip.on { background: var(--bc, var(--brass)); color: #fff; }
  .bicho-chip.grupo { border-style: dashed; }
  .bicho-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  /* ---- Fase 1: resumo, status, ajuda ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi-mini { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--paper); box-shadow: var(--shadow-sm); }
  .kpi-mini .l { font-size: 11px; color: var(--ink-soft); margin: 0 0 4px; }
  .kpi-mini .v { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .kpi-mini.destaque { background: var(--brass-bg); border-color: var(--brass-border); }
  .kpi-mini .s { font-size: 10px; color: var(--ink-soft); margin: 3px 0 0; }
  .meta-card.st-estourada { border-left: 3px solid var(--red); padding-left: 10px; }
  .meta-card.st-pendente, .meta-card.st-vencendo { border-left: 3px solid var(--brass); padding-left: 10px; }
  .meta-card.st-vencida { border-left: 3px solid var(--red); padding-left: 10px; }
  .meta-card.st-andamento { border-left: 3px solid var(--line); padding-left: 10px; }
  .meta-card.st-acima, .meta-card.st-fechada, .meta-card.st-lancada { border-left: 3px solid var(--green); padding-left: 10px; }
  .st-tag { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  details.more { margin: 6px 0; font-size: 11px; color: var(--ink-soft); }
  details.more summary { cursor: pointer; display: inline-block; user-select: none; }
  details.more p { margin-top: 4px; }
  /* ---- Áreas (Projeções / Lançamentos) ---- */
  .area-nav { display: flex; gap: 6px; padding: 4px; background: var(--paper-dark); border-radius: var(--radius); margin-bottom: 16px; }
  .area-btn { flex: 1; font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 8px; border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-family: inherit; }

const pad2 = (n) => String(n).padStart(2, "0");

function addMonthsToKey(key, n) {
  let [y, m] = key.split("-").map(Number);
  m += n;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${pad2(m)}`;
}

function addDaysToDate(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

const DIAS_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

function getPlannedItemsForMonth(items, year, month) {
  const key = `${year}-${pad2(month + 1)}`;
  return items.filter((p) => {
    if (p.mode === "pontual") return p.month === key;
    if (p.startMonth && key < p.startMonth) return false;
    if (p.endMonth && key > p.endMonth) return false;
    // Meta recorrente arquivada: deixa de valer a partir do mês de corte (meses anteriores ficam intactos).
    if (p.archivedFrom && key >= p.archivedFrom) return false;
    return true;
  }).map((p) => {
    // Ajuste "só neste mês": p.overrides = { "2026-10": 620 } troca o valor apenas naquele mês.
    const ov = p.overrides ? p.overrides[key] : undefined;
    return (ov !== undefined && ov !== null) ? { ...p, baseValue: p.value, value: Number(ov), overridden: true } : p;
  });
}

function monthLabel(key) {
  return `${MESES[Number(key.slice(5, 7)) - 1]}/${key.slice(2, 4)}`;
}

// Mês de planejamento (chave YYYY-MM) a que uma data pertence, respeitando a competência excepcional.
function planKeyForDate(dateStr) {
  if (!dateStr) return currentMonthKey;
  if (dateStr >= "2026-08-27" && dateStr <= "2026-09-30") return "2026-09";
  if (dateStr >= "2026-08-01" && dateStr <= "2026-08-26") return "2026-08";
  return dateStr.slice(0, 7);
}

// Metas de um tipo que estão valendo no mês da data informada (é o que o seletor "Meta" deve oferecer).
function plannedActiveForDate(dateStr, type) {
  const key = planKeyForDate(dateStr);
  const [y, m] = key.split("-").map(Number);
  return getPlannedItemsForMonth(state.plannedItems, y, m - 1).filter((p) => p.type === type);
}

// Data "de caixa" de um lançamento: pra cartão de crédito com vencimento definido, o que importa
// pro fluxo de caixa e pra projeção é o vencimento, não a data da compra — evita cair no "loop do
// cartão" (achar que já pagou algo que só vai vencer no mês que vem). Pra tudo mais, é a própria data.
function cashKey(t) {
  return t.isCartao && t.dueDate ? t.dueDate : t.date;
}

function computeRunningBalance(transactions) {
  const sorted = [...transactions].sort((a, b) => cashKey(a).localeCompare(cashKey(b)) || a.id.localeCompare(b.id));
  let running = 0;
  return sorted.map((t) => {
    running += t.type === "receita" ? Number(t.value) : -Number(t.value);
    return { ...t, balance: running };
  });
}

function closingBalanceThrough(withBalance, throughKey) {
  const filtered = withBalance.filter((t) => cashKey(t).slice(0, 7) <= throughKey);
  return filtered.length ? filtered[filtered.length - 1].balance : 0;
}

// Limites reais do período de um mês/ano — aplica a competência excepcional:
// setembro/2026 vai de 27/08 a 30/09; agosto/2026 fica só até 26/08.
function getPeriodBounds(year, month) {
  if (year === 2026 && month === 8) return { start: "2026-08-27", end: "2026-09-30" };
  if (year === 2026 && month === 7) return { start: "2026-08-01", end: "2026-08-26" };
  const key = `${year}-${pad2(month + 1)}`;
  const lastDay = new Date(year, month + 1, 0).getDate();
  return { start: `${key}-01`, end: `${key}-${pad2(lastDay)}` };
}

function transactionsInPeriod(list, year, month) {
  const { start, end } = getPeriodBounds(year, month);
  return list.filter((t) => t.date >= start && t.date <= end);
}

// ================= AUTENTICAÇÃO =================
async function checkAuth() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      return true;
    }
  } catch (e) { /* segue pro login */ }
  currentUser = null;
  return false;
}

async function doLogin() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  if (!email || !password) { errEl.textContent = "Preenche e-mail e senha."; return; }
  errEl.textContent = "";
  btn.textContent = "Entrando...";
  btn.disabled = true;
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = "E-mail ou senha incorretos.";
      btn.textContent = "Entrar";
      btn.disabled = false;
      return;
    }
    currentUser = data.user;
    state.loading = true;
    render();
    await loadData();
  } catch (e) {
    errEl.textContent = "Não foi possível conectar. Confira sua internet e tente de novo.";
    btn.textContent = "Entrar";
    btn.disabled = false;
  }
}

async function doLogout() {
  await sb.auth.signOut();
  currentUser = null;
  location.reload();
}

function renderLogin() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="login-box">

  `;
  document.getElementById("login-btn").addEventListener("click", doLogin);
  document.getElementById("login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  document.getElementById("login-email").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

// ================= PERSISTÊNCIA (Supabase) =================
// Uma única linha por usuário na tabela app_state (coluna "data", tipo jsonb), protegida por
// Row Level Security — só o próprio usuário logado enxerga e grava a sua linha.
async function loadData() {
  const authed = await checkAuth();
  if (!authed) { renderLogin(); return; }
  try {
    const { data, error } = await sb.from("app_state").select("data").eq("user_id", currentUser.id).maybeSingle();
    if (error) throw error;
    const parsed = data && data.data ? data.data : null;
    if (parsed) {
      state.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      state.categories = (Array.isArray(parsed.categories) && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES;
      state.notes = parsed.notes && typeof parsed.notes === "object" ? parsed.notes : {};
      state.finalizados = parsed.finalizados && typeof parsed.finalizados === "object" ? parsed.finalizados : {};
      state.reconciliados = parsed.reconciliados && typeof parsed.reconciliados === "object" ? parsed.reconciliados : {};
      state.fechamentos = parsed.fechamentos && typeof parsed.fechamentos === "object" ? parsed.fechamentos : {};
      state.cartoes = Array.isArray(parsed.cartoes) ? parsed.cartoes : DEFAULT_CARTOES;
      state.loans = Array.isArray(parsed.loans) ? parsed.loans : [];
      state.reservaAportes = Array.isArray(parsed.reservaAportes) ? parsed.reservaAportes : [];
      state.bichos = Array.isArray(parsed.bichos) ? parsed.bichos : [];
      state.grupos = Array.isArray(parsed.grupos) ? parsed.grupos : [];
      state.parcelados = Array.isArray(parsed.parcelados) ? parsed.parcelados : [];
      state.plannedItems = Array.isArray(parsed.plannedItems) ? parsed.plannedItems : [];
    } else {
      // primeiro acesso: cria a linha vazia desse usuário
      state.transactions = [];
      state.categories = DEFAULT_CATEGORIES;
      state.plannedItems = [];
      state.notes = {};
      state.finalizados = {};
      state.reconciliados = {};
      state.fechamentos = {};
      state.cartoes = DEFAULT_CARTOES;
      state.loans = [];
      state.reservaAportes = [];
      await persist();
    }
  } catch (e) {
    state.transactions = [];
    state.categories = DEFAULT_CATEGORIES;
    state.plannedItems = [];
    state.notes = {};
    state.finalizados = {};
    state.reconciliados = {};
    state.fechamentos = {};
    state.cartoes = DEFAULT_CARTOES;
    state.loans = [];
    state.reservaAportes = [];
    state.loadError = true;
  } finally {
    state.loading = false;
    render();
  }
}

async function persist() {
  if (!currentUser) return;
  try {
    const payload = {
      transactions: state.transactions, categories: state.categories, notes: state.notes,
      plannedItems: state.plannedItems, finalizados: state.finalizados, reconciliados: state.reconciliados,
      fechamentos: state.fechamentos, cartoes: state.cartoes, loans: state.loans, reservaAportes: state.reservaAportes,
      bichos: state.bichos, grupos: state.grupos, parcelados: state.parcelados,
    };
    const { error } = await sb.from("app_state").upsert({ user_id: currentUser.id, data: payload, updated_at: new Date().toISOString() });
    state.saveError = !!error;
  } catch (e) {
    state.saveError = true;
  }
}

// ---------- Cartões de crédito ----------
function addCartao(e) {
  e.preventDefault();
  if (!newCard.nome.trim()) return;
  const dia = Math.min(28, Math.max(1, Number(newCard.vencimentoDia) || 10));
  state.cartoes.push({ id: uid(), nome: newCard.nome.trim(), cor: newCard.cor, icone: "💳", vencimentoDia: dia });
  persist();
  newCard = { nome: "", cor: "#8A05BE", vencimentoDia: 10 };
  render();
}
function deleteCartao(id) {
  if (!confirm("Excluir este cartão? Lançamentos já feitos com ele não são apagados, só deixam de referenciar um cartão cadastrado.")) return;
  state.cartoes = state.cartoes.filter((c) => c.id !== id);
  persist(); render();
}
function updateCartaoDia(id, value) {
  const dia = Math.min(28, Math.max(1, Number(value) || 1));
  state.cartoes = state.cartoes.map((c) => (c.id === id ? { ...c, vencimentoDia: dia } : c));
  persist(); render();
}

// Próximo vencimento de um cartão a partir de uma data de compra: se o dia de fechamento/vencimento
// cadastrado já passou dentro do mesmo mês da compra, joga pro mês seguinte.
function nextDueDate(vencimentoDia, fromDateStr) {
  const [y, m, d] = fromDateStr.split("-").map(Number);
  let targetY = y, targetM = m;
  if (d > vencimentoDia) { targetM += 1; if (targetM > 12) { targetM = 1; targetY += 1; } }
  const lastDay = new Date(targetY, targetM, 0).getDate();
  return `${targetY}-${pad2(targetM)}-${pad2(Math.min(vencimentoDia, lastDay))}`;
}

// ---------- Empréstimos consignados ----------
// Saldo devedor estimado pela fórmula de amortização (Tabela Price, padrão de consignado):
// dado o valor fixo da parcela, a taxa de juros mensal e quantas parcelas já foram pagas,
// calcula quanto ainda falta pagar de principal — sem precisar saber o valor original contratado.
// Pagamentos lançados no app DEPOIS do último saldo conferido no banco (os que já vieram da base
// ou foram lançados antes dessa conferência já estão embutidos no saldo do banco).
function pagamentosDesdeSnapshot(loan) {
  const desde = loan.saldoDevedorManualEm || "";
  return (loan.pagamentos || []).filter((p) => p.registradoEm && p.registradoEm > desde)
    .sort((a, b) => a.registradoEm.localeCompare(b.registradoEm));
}

function saldoDevedorLoan(loan) {
  // Se o usuário já conferiu e digitou o saldo real (do app do banco), esse número é o ponto de
  // partida — é mais confiável do que qualquer estimativa — e cada pagamento lançado depois dele
  // amortiza o saldo: cresce com os juros do mês e cai pelo valor pago (saldo × (1+taxa) − pagamento).
  if (loan.saldoDevedorManual !== null && loan.saldoDevedorManual !== undefined) {
    if ((loan.pagamentos || []).length >= loan.parcelasTotais) return 0;
    const i = (Number(loan.taxaJurosMensal) || 0) / 100;
    let saldo = Number(loan.saldoDevedorManual);
    pagamentosDesdeSnapshot(loan).forEach((pg) => { saldo = Math.max(0, saldo * (1 + i) - Number(pg.valor)); });
    return saldo;
  }
  const k = (loan.pagamentos || []).length;
  const restantes = Math.max(0, loan.parcelasTotais - k);
  if (restantes === 0) return 0;
  const i = (Number(loan.taxaJurosMensal) || 0) / 100;
  if (i === 0) return loan.parcela * restantes; // sem taxa informada: estimativa linear simples
  return loan.parcela * (1 - Math.pow(1 + i, -restantes)) / i;
}

// Registra um pagamento de fato (com data), em vez de só incrementar um contador —
// assim dá pra conferir contra o contracheque mês a mês.
function registrarPagamentoLoan(loanId) {
  const np = newPagamento[loanId];
  if (!np || !np.valor || Number(np.valor) <= 0) return;
  state.loans = state.loans.map((l) => {
    if (l.id !== loanId) return l;
    if ((l.pagamentos || []).length >= l.parcelasTotais) return l;
    return { ...l, pagamentos: [...(l.pagamentos || []), { id: uid(), date: np.date, valor: Number(np.valor), registradoEm: new Date().toISOString() }] };
  });
  delete newPagamento[loanId];
  persist(); render();
}
function deletePagamentoLoan(loanId, pagamentoId) {
  state.loans = state.loans.map((l) => (l.id === loanId ? { ...l, pagamentos: (l.pagamentos || []).filter((p) => p.id !== pagamentoId) } : l));
  persist(); render();
}
function updateLoanTaxa(id, value) {
  const v = Math.max(0, Number(value) || 0);
  state.loans = state.loans.map((l) => (l.id === id ? { ...l, taxaJurosMensal: v } : l));
  persist(); render();
}
function updateLoanSaldoManual(id, value) {
  const v = value === "" ? null : Math.max(0, Number(value) || 0);
  state.loans = state.loans.map((l) => (l.id === id ? { ...l, saldoDevedorManual: v, saldoDevedorManualEm: v === null ? null : new Date().toISOString() } : l));
  persist(); render();
}
function limparSaldoManualLoan(id) {

// Fechamento do mês: guarda uma fotografia dos totais (planejado/atualizado/realizado e as
// maiores diferenças) no momento da confirmação. Não trava lançamentos — se algo for corrigido
// depois, o relatório do fechamento continua mostrando o que foi visto naquele dia, e os
// números "ao vivo" do painel seguem recalculando normalmente a partir daí.
function closeMonth(year, month) {
  const key = `${year}-${pad2(month + 1)}`;
  const mc = getMonthComparison(year, month);
  if (!mc) return;
  if (!confirm(`Confirmar fechamento de ${monthLabel(key)}?\n\nIsso grava uma fotografia dos números de hoje (planejado, previsão e realizado). Você ainda pode editar lançamentos depois, mas o relatório desse fechamento fica guardado do jeito que está agora.`)) return;
  const topDiffs = [...mc.rows].filter((r) => r.lancado).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 8)
    .map((r) => ({ description: r.description, type: r.type, meta: r.value, realizado: r.realizado, diff: r.diff }));
  const pendentes = mc.rows.filter((r) => !r.lancado).map((r) => ({ description: r.description, type: r.type, meta: r.value }));
  state.fechamentos[key] = {
    closedAt: new Date().toISOString(),
    totalPlanejadoReceita: mc.totalPlanejadoReceita, totalPlanejadoDespesa: mc.totalPlanejadoDespesa,
    totalAtualizadoReceita: mc.totalAtualizadoReceita, totalAtualizadoDespesa: mc.totalAtualizadoDespesa,
    totalRealizadoReceita: mc.totalRealizadoReceita, totalRealizadoDespesa: mc.totalRealizadoDespesa,
    naoPrevistosReceita: mc.naoPrevistosReceita, naoPrevistosDespesa: mc.naoPrevistosDespesa,
    qtdNaoPrevistos: mc.naoPrevistos.length, topDiffs, pendentes,
  };
  persist(); render();
}

function reopenMonth(key) {
  if (!confirm(`Reabrir ${monthLabel(key)}? O relatório gravado desse fechamento será apagado (os lançamentos em si não são afetados).`)) return;
  delete state.fechamentos[key];
  persist(); render();
}

// Relatório de fechamento em texto simples — dá pra copiar e colar aqui no chat sem precisar
// exportar a base inteira. Usa a fotografia gravada quando o mês está fechado; senão, usa os
// números ao vivo (prefixados como "até agora").
function generateMonthReportText(year, month) {
  const key = `${year}-${pad2(month + 1)}`;
  const fech = state.fechamentos[key];
  const mc = getMonthComparison(year, month);
  const emFechamento = !!fech;
  const d = (v) => brl(v);
  let out = `RELATÓRIO — ${monthLabel(key)}\n`;
  out += emFechamento ? `Fechado em ${new Date(fech.closedAt).toLocaleDateString("pt-BR")}\n` : `(mês ainda aberto — números até agora)\n`;
  out += `\n`;
  const src = emFechamento ? fech : {
    totalPlanejadoReceita: mc.totalPlanejadoReceita, totalPlanejadoDespesa: mc.totalPlanejadoDespesa,
    totalAtualizadoReceita: mc.totalAtualizadoReceita, totalAtualizadoDespesa: mc.totalAtualizadoDespesa,
    totalRealizadoReceita: mc.totalRealizadoReceita, totalRealizadoDespesa: mc.totalRealizadoDespesa,
    naoPrevistosReceita: mc.naoPrevistosReceita, naoPrevistosDespesa: mc.naoPrevistosDespesa,
    qtdNaoPrevistos: mc.naoPrevistos.length,
    topDiffs: [...mc.rows].filter((r) => r.lancado).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 8)
      .map((r) => ({ description: r.description, type: r.type, meta: r.value, realizado: r.realizado, diff: r.diff })),
    pendentes: mc.rows.filter((r) => !r.lancado).map((r) => ({ description: r.description, type: r.type, meta: r.value })),
  };
  out += `PLANEJADO   receitas ${d(src.totalPlanejadoReceita)}  despesas ${d(src.totalPlanejadoDespesa)}  saldo ${d(src.totalPlanejadoReceita - src.totalPlanejadoDespesa)}\n`;
  out += `PREVISÃO    receitas ${d(src.totalAtualizadoReceita)}  despesas ${d(src.totalAtualizadoDespesa)}  saldo ${d(src.totalAtualizadoReceita - src.totalAtualizadoDespesa)}\n`;
  out += `REALIZADO   receitas ${d(src.totalRealizadoReceita)}  despesas ${d(src.totalRealizadoDespesa)}  saldo ${d(src.totalRealizadoReceita - src.totalRealizadoDespesa)}\n`;
  out += `\nNão previstos: ${src.qtdNaoPrevistos} lançamento(s), receita ${d(src.naoPrevistosReceita)} / despesa ${d(src.naoPrevistosDespesa)}\n`;
  if (src.topDiffs.length) {
    out += `\nMaiores diferenças (meta x realizado):\n`;
    src.topDiffs.forEach((r) => { out += `  ${r.type === "receita" ? "[R]" : "[D]"} ${r.description}: meta ${d(r.meta)} → real ${d(r.realizado)} (${r.diff >= 0 ? "+" : ""}${d(r.diff)})\n`; });
  }
  if (src.pendentes.length) {
    out += `\nAinda não lançado:\n`;
    src.pendentes.forEach((r) => { out += `  ${r.type === "receita" ? "[R]" : "[D]"} ${r.description}: ${d(r.meta)}\n`; });
  }
  return out;
}

// Mês fechado trava os lançamentos daquele período (reversível só reabrindo o mês).
function isMonthKeyClosed(key) {
  return !!state.fechamentos[key];
}
function isDateLocked(dateStr) {
  return isMonthKeyClosed(planKeyForDate(dateStr));
}
function lockedAlert(dateStr) {
  const key = planKeyForDate(dateStr);
  alert(`${monthLabel(key)} está fechado. Reabra o mês (botão "↩️ Reabrir mês") para poder editar, excluir ou lançar algo nessa data.`);
}

// ================= BICHOS (etiquetas) =================
function bichoById(id) { return state.bichos.find((b) => b.id === id) || null; }
function bichosValidos(ids) { return (Array.isArray(ids) ? ids : []).filter((id) => !!bichoById(id)); }
function bichoChips(t) {
  const ids = bichosValidos(t && t.bichoIds);
  if (ids.length === 0) return "";
  return ids.map((id) => { const b = bichoById(id); return ` <span class="bicho-tag" style="--bc:${esc(b.cor)}">🐾 ${esc(b.nome)}</span>`; }).join("");
}
// Etiquetas efetivas do formulário: se o usuário ainda não mexeu, herda as da projeção escolhida.
function formBichoIds() {
  if (form.bichosTocado) return bichosValidos(form.bichoIds);
  const pi = state.plannedItems.find((x) => x.id === form.plannedItemId);
  return bichosValidos(pi && pi.bichoIds);
}
// Parte de cada bicho num lançamento: despesa dividida igualmente entre os bichos etiquetados.
function partesPorBicho(t) {
  if (t.type !== "despesa" || !t.date || t.date < ETIQUETA_INICIO) return [];
  const ids = bichosValidos(t.bichoIds);
  if (ids.length === 0) return [];
  const parte = Number(t.value) / ids.length;
  return ids.map((id) => ({ bichoId: id, parte }));
}
function addBicho() {
  const nome = (document.getElementById("bicho-nome")?.value || "").trim();
  const cor = document.getElementById("bicho-cor")?.value || "#7C3AED";
  if (!nome) return;
  if (state.bichos.some((b) => b.nome.toLowerCase() === nome.toLowerCase())) { alert("Já existe um bicho com esse nome."); return; }
  state.bichos.push({ id: uid(), nome, cor });

}
function delBicho(id) {
  const b = bichoById(id); if (!b) return;
  const usos = state.transactions.filter((t) => (t.bichoIds || []).includes(id)).length;
  if (!confirm(`Excluir "${b.nome}"?${usos ? `\n\n${usos} lançamento(s) estão etiquetados com ele. Eles continuam existindo, mas perdem essa etiqueta nos relatórios.` : ""}`)) return;

  form.bichoIds = (form.bichoIds || []).filter((x) => x !== id);

}
function addGrupo() {

}
function delGrupo(id) {

}
function toggleFormBicho(id) {

  form.bichosTocado = true; render();
}
function toggleFormGrupo(gid) {

  const gIds = bichosValidos(g.bichoIds);

function toggleMetaBicho(plannedId, bichoId) {
  state.plannedItems = state.plannedItems.map((p) => {
    if (p.id !== plannedId) return p;
    const cur = bichosValidos(p.bichoIds);
    return { ...p, bichoIds: cur.includes(bichoId) ? cur.filter((x) => x !== bichoId) : [...cur, bichoId] };
  });

}

function lancarParcela(parcId, num) {
  const pc = (state.parcelados || []).find((x) => x.id === parcId);
  if (!pc) return;
  const key = parcelaMonthKey(pc, num);
  if (isMonthKeyClosed(key)) { alert(`${monthLabel(key)} está fechado. Reabra o mês pra poder lançar.`); return; }
  const [y, m] = key.split("-").map(Number);
  const cartao = state.cartoes.find((c) => c.id === pc.cartaoId);
  form = {
    ...emptyForm(),
    date: clampDateToPeriod(localTodayISO(), y, m - 1),
    description: `${pc.descricao} (parcela ${num}/${pc.total})`,
    type: "despesa", categoryId: pc.categoryId || categoriesForType("despesa")[0]?.id || "",
    value: String(pc.valor), isCartao: !!cartao, cartaoId: cartao ? cartao.id : null,
    dueDate: parcelaDueDate(pc, key), formaPagamento: cartao ? cartao.id : "",
    parcelaId: pc.id, parcelaNum: num, fromQuick: true,
  };
  editingTxId = null;
  state.showForm = true;
  render();
  document.getElementById("tx-form")?.scrollIntoView({ behavior: "smooth", block: "center" });
}
function addParcelado() {
  const g = (id) => document.getElementById(id);
  const descricao = ((g("pc-desc") || {}).value || "").trim();
  const cartaoId = (g("pc-cartao") || {}).value || "";
  const valor = Number((g("pc-valor") || {}).value);
  const total = parseInt((g("pc-total") || {}).value, 10);
  const numAtual = parseInt((g("pc-atual") || {}).value, 10) || 1;
  const primeiraVenc = (g("pc-mes") || {}).value || "";
  const categoryId = (g("pc-cat") || {}).value || "";
  if (!descricao || !cartaoId || !(valor > 0) || !(total >= 1) || numAtual < 1 || numAtual > total || !/^\d{4}-\d{2}$/.test(primeiraVenc)) {
    alert("Preencha descrição, cartão, valor da parcela, total de parcelas e o mês da primeira fatura. A parcela atual deve ficar entre 1 e o total.");
    return;
  }
  state.parcelados.push({ id: uid(), descricao, cartaoId, valor, total, numAtual, primeiraVenc, categoryId });
  persist(); render();
}
function delParcelado(id) {
  const pc = state.parcelados.find((x) => x.id === id); if (!pc) return;
  const vinc = state.transactions.filter((t) => t.parcelaId === id).length;
  if (!confirm(`Excluir o compromisso "${pc.descricao}"?\n\nAs parcelas futuras deixam de ser previstas.${vinc ? ` Os ${vinc} lançamento(s) já registrados continuam, só perdem o vínculo com a parcela.` : ""}`)) return;
  state.transactions = state.transactions.map((t) => (t.parcelaId === id ? { ...t, parcelaId: null, parcelaNum: null } : t));
  state.parcelados = state.parcelados.filter((x) => x.id !== id);
  persist(); render();
}
function detectarGruposParcela() {
  const re = /^(.*?)\s*\(parcela\s+(\d+)\s*\/\s*(\d+)\)\s*$/i;
  const grupos = {};
  state.plannedItems.forEach((p) => {
    if (p.type !== "despesa" || p.mode !== "pontual" || !p.month) return;
    const m = re.exec(p.description || ""); if (!m) return;
    const base = m[1].trim(), num = Number(m[2]), total = Number(m[3]);
    const k = p.groupId ? `g:${p.groupId}` : `b:${base.toLowerCase()}|${total}`;
    (grupos[k] = grupos[k] || { key: k, base, total, itens: [] }).itens.push({ p, num });
  });
  return Object.values(grupos).map((g) => ({ ...g, itens: g.itens.sort((a, b) => a.num - b.num) }));
}
function converterGrupoParcela(key, cartaoId) {
  const g = detectarGruposParcela().find((x) => x.key === key);
  if (!g) return;
  if (!cartaoId) { alert("Escolha o cartão em que essa compra foi parcelada."); return; }
  const first = g.itens[0];
  const nums = new Set(g.itens.map((it) => it.num));
  const consecutivo = nums.size === g.itens.length && g.itens.every((it) => addMonthsToKey(first.p.month, it.num - first.num) === it.p.month);
  if (!consecutivo) { alert("As parcelas dessa compra não estão em meses consecutivos (ou há parcela repetida). Não dá para converter automaticamente — cadastre o compromisso manualmente."); return; }
  if (!confirm(`Converter "${g.base}" (${g.itens.length} projeções, parcelas ${first.num} a ${g.itens[g.itens.length - 1].num} de ${g.total}) em um compromisso de cartão?\n\nAs projeções saem da lista de metas e passam a aparecer no bloco "Parcelas no cartão" e nas faturas. Os lançamentos já feitos continuam e ficam vinculados às parcelas.`)) return;
  const id = uid();
  const norm = (x) => String(x || "").trim().toLowerCase();
  let vinculados = 0;
  state.transactions = state.transactions.map((t) => {
    if (t.parcelaId) return t;
    for (const it of g.itens) {
      const [yy, mm] = it.p.month.split("-").map(Number);
      const { start, end } = getPeriodBounds(yy, mm - 1);
      const casa = t.plannedItemId === it.p.id || (!t.plannedItemId && t.type === "despesa" && norm(t.description) === norm(it.p.description) && t.date >= start && t.date <= end);
      if (casa) { vinculados++; return { ...t, parcelaId: id, parcelaNum: it.num, plannedItemId: null }; }
    }
    return t;
  });
  const ids = new Set(g.itens.map((it) => it.p.id));
  state.plannedItems = state.plannedItems.filter((p) => !ids.has(p.id));
  state.parcelados.push({ id, descricao: g.base, cartaoId, valor: Number(first.p.value), total: g.total, numAtual: first.num, primeiraVenc: first.p.month, categoryId: first.p.categoryId });
  persist(); render();
  alert(`Convertido: ${g.itens.length} parcelas, ${vinculados} lançamento(s) vinculado(s).`);
}

function addTransaction(e) {
  e.preventDefault();
  if (!form.description.trim() || !form.value || Number(form.value) <= 0) return;
  if (!form.formaPagamento) { alert("Escolha a forma de pagamento antes de lançar."); return; }
  if (editingTxId) {
    const original = state.transactions.find((t) => t.id === editingTxId);
    if ((original && isDateLocked(original.date)) || isDateLocked(form.date)) { lockedAlert((original && isDateLocked(original.date)) ? original.date : form.date); return; }
  } else if (isDateLocked(form.date)) {
    lockedAlert(form.date); return;
  }
  const extra = { isCartao: !!form.isCartao, cartaoId: form.isCartao ? (form.cartaoId || null) : null, dueDate: form.isCartao ? (form.dueDate || null) : null, plannedItemId: form.parcelaId ? null : (form.plannedItemId || null), bichoIds: formBichoIds(), parcelaId: form.parcelaId || null, parcelaNum: form.parcelaId ? form.parcelaNum : null };
  if (editingTxId) {
    state.transactions = state.transactions.map((t) =>
      t.id === editingTxId
        ? { ...t, date: form.date, description: form.description.trim(), type: form.type, categoryId: form.categoryId, value: Number(form.value), ...extra }
        : t
    );
    editingTxId = null;
  } else {
    state.transactions.push({ id: uid(), date: form.date, description: form.description.trim(), type: form.type, categoryId: form.categoryId, value: Number(form.value), ...extra });
  }
  persist();
  form = emptyForm();
  state.showForm = false;
  render();
}

function emptyForm() {

function startEditTransaction(id) {

  const color = palette[state.categories.filter((c) => c.type === newCat.type).length % palette.length];

function diaValido(v) { const d = parseInt(v, 10); return d >= 1 && d <= 31 ? d : null; }

function addPlannedItem(e) {
  e.preventDefault();
  if (goalForm.mode === "parcelado") {
    if (!goalForm.description.trim() || !goalForm.value || Number(goalForm.value) <= 0) return;
    const n = Math.max(2, parseInt(goalForm.installments, 10) || 2);
    const groupId = uid();
    for (let i = 0; i < n; i++) {
      state.plannedItems.push({
        id: uid(), groupId,
        description: `${goalForm.description.trim()} (parcela ${i + 1}/${n})`,
        type: "despesa", categoryId: goalForm.categoryId, value: Number(goalForm.value),
        mode: "pontual", month: addMonthsToKey(goalForm.installStartMonth, i), diaVencimento: diaValido(goalForm.diaVencimento),
      });
    }
  } else {
    if (!goalForm.description.trim() || !goalForm.value || Number(goalForm.value) <= 0) return;
    const base = { id: uid(), description: goalForm.description.trim(), type: goalForm.type, categoryId: goalForm.categoryId, value: Number(goalForm.value), mode: goalForm.mode, diaVencimento: diaValido(goalForm.diaVencimento) };
    const item = goalForm.mode === "pontual" ? { ...base, month: goalForm.month } : { ...base, startMonth: goalForm.startMonth, endMonth: goalForm.endMonth || null };
    state.plannedItems.push(item);
  }
  persist();
  goalForm.description = ""; goalForm.value = ""; goalForm.diaVencimento = "";
  render();
}

function deletePlannedItem(id) {

// Ajusta o valor de uma meta SÓ num mês (os demais meses continuam com o valor base).
function setMonthOverride(itemId, monthKey, value) {
  const v = Number(value);
  if (!isFinite(v) || v < 0) return;
  state.plannedItems = state.plannedItems.map((p) => {
    if (p.id !== itemId) return p;
    const overrides = { ...(p.overrides || {}) };
    if (v === p.value) delete overrides[monthKey]; else overrides[monthKey] = v;
    const next = { ...p, overrides };
    if (Object.keys(overrides).length === 0) delete next.overrides;
    return next;
  });
  persist();
}

function clearMonthOverride(itemId, monthKey) {
  state.plannedItems = state.plannedItems.map((p) => {
    if (p.id !== itemId || !p.overrides) return p;
    const overrides = { ...p.overrides };
    delete overrides[monthKey];
    const next = { ...p, overrides };
    if (Object.keys(overrides).length === 0) delete next.overrides;
    return next;
  });
  persist();
}

// Arquiva uma meta: some da lista de metas e do seletor; o histórico dos meses já vividos é preservado.
// Clamping: se a data de hoje cair fora do período do mês em vista, usa a borda do período
// (por ex. editando um mês passado ou futuro, não faz sentido lançar com a data de hoje).
function clampDateToPeriod(dateStr, year, month) {
  const { start, end } = getPeriodBounds(year, month);
  if (dateStr < start) return start;
  if (dateStr > end) return end;
  return dateStr;
}

// Lança uma meta de um clique só, pelo valor planejado (ótimo pra parcelas de cartão, cujo
// valor já é certo). Fica marcada como cartão automaticamente quando a descrição sugere isso.
function quickLaunchPlannedItem(id, year, month) {
  const p = state.plannedItems.find((x) => x.id === id);
  if (!p) return;
  const key = `${year}-${pad2(month + 1)}`;
  if (isMonthKeyClosed(key)) { alert(`${monthLabel(key)} está fechado. Reabra o mês pra poder lançar.`); return; }
  const row = getMonthComparison(year, month).rows.find((r) => r.id === id);
  form = {
    ...emptyForm(),
    date: clampDateToPeriod(localTodayISO(), year, month),
    description: p.description, type: p.type, categoryId: p.categoryId,
    value: String(row ? row.value : p.value),
    plannedItemId: p.id, formaPagamento: "", fromQuick: true,
    bichoIds: bichosValidos(p.bichoIds), bichosTocado: false,
  };
  editingTxId = null;
  state.showForm = true;
  render();
  document.getElementById("tx-form")?.scrollIntoView({ behavior: "smooth", block: "center" });
}

function archivePlannedItem(id, ctxKey) {
  const p = state.plannedItems.find((x) => x.id === id);
  if (!p) return;
  const patch = { archived: true };
  let msg;
  if (p.mode === "pontual") {
    msg = `Arquivar "${p.description}"?\n\nEla continua aparecendo em ${monthLabel(p.month)} (histórico), mas some da lista de metas e do seletor de meta dos outros meses.`;
  } else {
    let cut = addMonthsToKey(ctxKey, 1);
    if (p.startMonth && cut < p.startMonth) cut = p.startMonth;
    patch.archivedFrom = cut;
    msg = `Arquivar "${p.description}"?\n\nEla deixa de valer a partir de ${monthLabel(cut)}. ${monthLabel(ctxKey)} e os meses anteriores continuam iguais.`;
  }
  if (!confirm(msg)) return;
  state.plannedItems = state.plannedItems.map((x) => (x.id === id ? { ...x, ...patch } : x));
  persist(); render();
}

function unarchivePlannedItem(id) {
  state.plannedItems = state.plannedItems.map((x) => {
    if (x.id !== id) return x;
    const { archived, archivedFrom, ...rest } = x;
    return rest;
  });
  persist(); render();
}

// Corrige o mês (vigência) de uma meta já criada — ex: criada em outubro mas era pra valer só em novembro.
function saveVigencia(id) {
  const p = state.plannedItems.find((x) => x.id === id);
  if (!p) return;
  if (p.mode === "pontual") {

    state.plannedItems = state.plannedItems.map((x) => (x.id === id ? { ...x, month: val } : x));

    if (!start) return;
    state.plannedItems = state.plannedItems.map((x) => (x.id === id ? { ...x, startMonth: start, endMonth: end || null } : x));
  }
  state.editingVigencia = null;
  persist(); render();
}

function exportBackup() {
  const payload = {
    transactions: state.transactions,
    categories: state.categories,
    notes: state.notes,
    plannedItems: state.plannedItems,
    finalizados: state.finalizados,
    reconciliados: state.reconciliados,

  };

function importBackupFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || typeof parsed !== "object") throw new Error("formato inválido");
      state.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : state.transactions;
      state.categories = Array.isArray(parsed.categories) ? parsed.categories : state.categories;
      state.plannedItems = Array.isArray(parsed.plannedItems) ? parsed.plannedItems : state.plannedItems;
      state.notes = parsed.notes && typeof parsed.notes === "object" ? parsed.notes : state.notes;
      state.finalizados = parsed.finalizados && typeof parsed.finalizados === "object" ? parsed.finalizados : state.finalizados;
      state.reconciliados = parsed.reconciliados && typeof parsed.reconciliados === "object" ? parsed.reconciliados : state.reconciliados;
      state.fechamentos = parsed.fechamentos && typeof parsed.fechamentos === "object" ? parsed.fechamentos : state.fechamentos;
      state.cartoes = Array.isArray(parsed.cartoes) ? parsed.cartoes : state.cartoes;
      state.loans = Array.isArray(parsed.loans) ? parsed.loans : state.loans;
      state.reservaAportes = Array.isArray(parsed.reservaAportes) ? parsed.reservaAportes : state.reservaAportes;
      state.bichos = Array.isArray(parsed.bichos) ? parsed.bichos : state.bichos;
      state.grupos = Array.isArray(parsed.grupos) ? parsed.grupos : state.grupos;
      state.parcelados = Array.isArray(parsed.parcelados) ? parsed.parcelados : state.parcelados;
      persist();
      render();
      alert("Backup importado com sucesso!");
    } catch (err) {
      alert("Não foi possível ler esse arquivo. Confira se é um backup exportado por este app.");
    }
  };
  reader.readAsText(file);
}

function categoriesForType(type) {

function catById(id) {

}

// Sugere uma meta pra etiquetar o lançamento: primeiro olha se essa descrição já foi
// etiquetada antes (ex: "Ração" sempre virou "Pets"); se não achar, e só existir UMA meta
// naquela categoria+tipo, sugere ela — sem forçar nada, o campo continua editável.
function suggestPlannedItemId(description, type, categoryId, dateStr) {
  if (form && form.parcelaId) return "";
  const ativas = plannedActiveForDate(dateStr, type);
  const activeIds = new Set(ativas.map((p) => p.id));
  const norm = description.trim().toLowerCase();
  if (norm) {
    const prior = [...state.transactions].reverse().find((t) => t.type === type && t.plannedItemId && activeIds.has(t.plannedItemId) && t.description.trim().toLowerCase() === norm);
    if (prior) return prior.plannedItemId;
  }
  const sameCat = ativas.filter((p) => p.categoryId === categoryId);
  if (sameCat.length === 1) return sameCat[0].id;
  return "";
}

function getWithRunningBalance() { return computeRunningBalance(state.transactions); }

function getVisibleTransactions(withBalance) {
  const list = state.showAll ? withBalance : transactionsInPeriod(withBalance, state.selectedYear, state.selectedMonth);
  return [...list].reverse();
}

function getCategoryBreakdown(withBalance, type = "despesa") {
  const scoped = state.showAll ? withBalance : transactionsInPeriod(withBalance, state.selectedYear, state.selectedMonth);
  const map = {};
  scoped.filter((t) => t.type === type).forEach((t) => { map[t.categoryId] = (map[t.categoryId] || 0) + Number(t.value); });

  }).sort((a, b) => b.total - a.total);

// Totais do mês anterior ao selecionado, para comparação nos cards do resumo.
function getPrevMonthTotals() {
  if (state.showAll) return null;
  let y = state.selectedYear, m = state.selectedMonth - 1;
  if (m < 0) { m = 11; y -= 1; }
  const tx = transactionsInPeriod(state.transactions, y, m);
  const receitas = tx.filter((t) => t.type === "receita").reduce((s, t) => s + Number(t.value), 0);
  const despesas = tx.filter((t) => t.type === "despesa").reduce((s, t) => s + Number(t.value), 0);
  return { receitas, despesas, label: `${MESES[m]}/${String(y).slice(2)}` };
}

// Monta um badge de variação (▲/▼ + %) comparando com o mês anterior.
function deltaBadge(curr, prev, biggerIsGood) {
  if (prev === null || prev === undefined) return "";
  if (prev === 0 && curr === 0) return "";
  const diff = curr - prev;
  const pct = prev !== 0 ? (diff / prev) * 100 : 100;
  const good = biggerIsGood ? diff >= 0 : diff <= 0;
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "•";
  const color = diff === 0 ? C.inkSoft : good ? C.green : C.red;
  return `<span style="font-size:10px;color:${color};font-weight:600;margin-left:6px;white-space:nowrap;">${arrow} ${Math.abs(pct).toFixed(0)}% vs mês ant.</span>`;
}

function getPlannerMonths() {
  const months = [];
  for (let y = 2026; y <= 2027; y++) {
    const startM = y === 2026 ? 8 : 0;
    for (let m = startM; m <= 11; m++) {
      months.push({ year: y, month: m, key: `${y}-${pad2(m + 1)}`, label: `${MESES[m]}/${String(y).slice(2)}` });
    }
  }
  return months;
}

function getPlannerData(withBalance) {
  // Implantação excepcional: a competência de setembro/2026 começa em 27/08 com saldo zerado,
  // ignorando o histórico acumulado de agosto.
  let cumulative = 0;
  return getPlannerMonths().map((pm) => {
    const items = getPlannedItemsForMonth(state.plannedItems, pm.year, pm.month);
    const metaReceitas = items.filter((i) => i.type === "receita").reduce((s, i) => s + i.value, 0);
    // parcelas de cartão já assumidas também são compromisso do mês (ver "Parcelas no cartão")
    const metaDespesas = items.filter((i) => i.type === "despesa").reduce((s, i) => s + i.value, 0)
      + parcelasDoMes(`${pm.year}-${pad2(pm.month + 1)}`).reduce((s, x) => s + x.valor, 0);

    // Se já existe lançamento real neste mês e ele excede a meta, adota o valor real atualizado
    // (pra cima, receita ou despesa), mas nunca reduz abaixo da meta original.
    const realTx = transactionsInPeriod(state.transactions, pm.year, pm.month);
    const realReceitas = realTx.filter((t) => t.type === "receita").reduce((s, t) => s + Number(t.value), 0);
    const realDespesas = realTx.filter((t) => t.type === "despesa").reduce((s, t) => s + Number(t.value), 0);

    const receitasExcedida = realReceitas > metaReceitas;
    const despesasExcedida = realDespesas > metaDespesas;
    const receitas = receitasExcedida ? realReceitas : metaReceitas;
    const despesas = despesasExcedida ? realDespesas : metaDespesas;

    const net = receitas - despesas;
    cumulative += net;
    return { ...pm, receitas, despesas, net, saldoAcumulado: cumulative, metaReceitas, metaDespesas, realReceitas, realDespesas, receitasExcedida, despesasExcedida };
  });
}

function dueDateFor(p, key) {
  const d = parseInt(p.diaVencimento, 10);
  if (!d || d < 1) return null;
  const [y, m] = key.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return `${key}-${pad2(Math.min(d, last))}`;
}
function diasAte(dateStr) {
  const a = new Date(localTodayISO() + "T00:00:00"), b = new Date(dateStr + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
// ================= PARCELAS NO CARTÃO =================
// Um "parcelado" é um compromisso já assumido: N parcelas, uma por fatura. Cada parcela cai no mês do
// vencimento da fatura e é "prevista" até você registrar a cobrança real (lançamento com parcelaId/parcelaNum).
function parcelaMonthKey(pc, num) { return addMonthsToKey(pc.primeiraVenc, num - pc.numAtual); }
function parcelaDueDate(pc, key) {
  const c = state.cartoes.find((x) => x.id === pc.cartaoId);
  const dia = c ? Number(c.vencimentoDia) || 10 : 10;
  const [y, m] = key.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return `${key}-${pad2(Math.min(dia, last))}`;
}
function parcelaTxs(pc, num) { return state.transactions.filter((t) => t.parcelaId === pc.id && Number(t.parcelaNum) === num); }
function parcelasDoMes(key) {
  const out = [];
  (state.parcelados || []).forEach((pc) => {
    for (let num = pc.numAtual; num <= pc.total; num++) {
      if (parcelaMonthKey(pc, num) !== key) continue;
      const txs = parcelaTxs(pc, num);
      const lancada = txs.length > 0;
      const realizado = txs.reduce((s, t) => s + Number(t.value), 0);
      out.push({ pc, num, valor: Number(pc.valor), dueDate: parcelaDueDate(pc, key), txs, lancada, realizado, atual: lancada ? realizado : Number(pc.valor) });
    }
  });
  return out.sort((a, b) => a.dueDate.localeCompare(b.dueDate) || a.pc.descricao.localeCompare(b.pc.descricao));
}
function parcelaBadge(t) {
  const pc = t.parcelaId ? (state.parcelados || []).find((x) => x.id === t.parcelaId) : null;
  return pc ? ` <span class="badge" style="background:var(--badge-gray)">parcela ${t.parcelaNum}/${pc.total}</span>` : "";
}

function renderParcelasBlock(mc) {
  if (!state.parcelados || state.parcelados.length === 0) return "";
  const lista = mc.parcelasMes;
  const hoje = localTodayISO();
  const fechado = isMonthKeyClosed(mc.key);
  const ddmm = (d) => new Date(d + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  let h = `<div class="proj-section parc-section" style="margin-top:16px;">`;
  h += `<div class="proj-head"><p class="panel-title" style="margin:0;font-size:14px;">💳 Parcelas no cartão <span class="muted" style="font-weight:400;">· ${lista.length} neste mês</span></p><div class="proj-stats">`;
  h += `<div><span>Previsto</span><b class="muted">${brl(mc.parcPlan)}</b></div><div><span>Realizado</span><b class="red">${brl(mc.parcReal)}</b></div><div><span>A pagar</span><b>${brl(mc.parcPend)}</b></div></div></div>`;
  if (lista.length === 0) h += `<p class="hint" style="margin:0 0 8px;">Nenhuma parcela cai neste mês.</p>`;
  lista.forEach((x) => {
    const c = state.cartoes.find((k) => k.id === x.pc.cartaoId);
    const rest = x.pc.total - x.num;
    let st;
    if (x.lancada) st = { label: "lançada", cor: C.green };
    else if (x.dueDate < hoje) st = { label: `fatura venceu ${ddmm(x.dueDate)}`, cor: C.red };
    else st = { label: `prevista · fatura ${ddmm(x.dueDate)}`, cor: C.brass };
    h += `<div class="parc-row"><div class="parc-main"><span class="dot-cartao" style="background:${c ? c.cor : "var(--ink-soft)"}"></span><strong>${esc(x.pc.descricao)}</strong><span class="muted">parcela ${x.num}/${x.pc.total}${c ? " · " + esc(c.nome) : ""}</span><span class="st-tag" style="color:${st.cor}">${st.label}</span>${rest > 0 ? `<span class="muted" style="font-size:11px;">faltam ${rest} · termina em ${monthLabel(parcelaMonthKey(x.pc, x.pc.total))}</span>` : `<span class="muted" style="font-size:11px;">última parcela</span>`}</div>`;
    h += `<div class="parc-side"><b class="red">${brl(x.atual)}</b>${!x.lancada && !fechado ? `<button class="btn btn-outline" style="font-size:11px;padding:3px 8px;min-height:0;" data-action="lancar-parcela" data-id="${x.pc.id}" data-num="${x.num}">⚡ Lançar</button>` : ""}</div></div>`;
  });
  // compromisso já assumido nos próximos meses
  const meses = [];
  for (let i = 0; i < 6; i++) { const k = addMonthsToKey(mc.key, i); meses.push({ k, v: parcelasDoMes(k).reduce((s, x) => s + x.atual, 0) }); }
  const max = Math.max(1, ...meses.map((m) => m.v));
  if (meses.some((m) => m.v > 0)) {
    h += `<p class="panel-title" style="margin:14px 0 6px;font-size:12px;">Já assumido nos próximos meses</p>`;
    meses.forEach((m) => { h += `<div class="bar-chart-row"><span class="bar-chart-label">${monthLabel(m.k)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${(m.v / max) * 100}%;background:var(--primary)"></span></span><span class="bar-chart-value">${brl(m.v)}</span></div>`; });
  }
  h += `</div>`;
  return h;
}

function renderParcManager() {
  let h = `<div class="panel"><p class="panel-title">💳 Parcelas no cartão</p>`;
  h += `<p class="hint" style="margin-top:0;">Compras parceladas que já foram assumidas. Cada parcela aparece no planejamento do mês e na fatura prevista do cartão, e deixa de ser "prevista" quando você lança a cobrança real.</p>`;
  if (state.cartoes.length === 0) {

  }
  const proxMes = addMonthsToKey(currentMonthKey, 1);
  h += `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">`;
  h += `<label class="field-label" style="flex:2;min-width:160px;">Descrição<input type="text" class="field" id="pc-desc" placeholder="ex.: Geladeira" /></label>`;
  h += `<label class="field-label" style="flex:1;min-width:130px;">Cartão<select class="field" id="pc-cartao">${state.cartoes.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></label>`;
  h += `<label class="field-label" style="width:110px;">Valor da parcela<input type="number" step="0.01" min="0" class="field" id="pc-valor" /></label>`;
  h += `<label class="field-label" style="width:90px;">Nº de parcelas<input type="number" min="1" max="60" class="field" id="pc-total" /></label>`;

  h += `<label class="field-label" style="width:150px;">Mês da fatura dessa parcela<input type="month" class="field" id="pc-mes" value="${proxMes}" /></label>`;
  h += `<label class="field-label" style="flex:1;min-width:130px;">Categoria<select class="field" id="pc-cat">${categoriesForType("despesa").map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>`;
  h += `<button class="btn btn-brass" data-action="add-parcelado">➕ Adicionar</button></div>`;
  if (state.parcelados.length === 0) h += `<p class="hint">Nenhum compromisso cadastrado.</p>`;
  state.parcelados.forEach((pc) => {
    const c = state.cartoes.find((k) => k.id === pc.cartaoId);
    let pagas = 0; for (let n = pc.numAtual; n <= pc.total; n++) if (parcelaTxs(pc, n).length) pagas++;
