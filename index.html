    html += `<button class="btn btn-outline" style="font-size:11px;padding:5px 9px;" data-action="toggle-report" data-key="${mcKey}">📄 ${state.showReportFor === mcKey ? "Fechar relatório" : "Ver relatório"}</button>`;
    html += fechamento
      ? `<button class="btn btn-outline" style="font-size:11px;padding:5px 9px;" data-action="reopen-month" data-key="${mcKey}">↩️ Reabrir mês</button>`
      : `<button class="btn btn-primary" style="font-size:11px;padding:5px 9px;" data-action="close-month" data-year="${state.selectedYear}" data-month="${state.selectedMonth}">✅ Confirmar fechamento do mês</button>`;
    html += `</div></div>`;
    if (state.selectedYear === 2026 && state.selectedMonth === 8) {
      html += `<p class="hint">Competência excepcional: de 27/08 a 30/09/2026, com saldo inicial zerado (início oficial do sistema).</p>`;
    }
    if (state.showReportFor === mcKey) {
      const reportText = generateMonthReportText(state.selectedYear, state.selectedMonth);
      html += `<div class="panel" style="background:var(--input-bg);margin-top:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <p class="panel-title" style="margin:0;">Relatório — cole aqui no chat se quiser que eu analise</p>
          <button class="btn btn-primary" style="font-size:11px;padding:5px 9px;" data-action="copy-report" data-key="${mcKey}">📋 Copiar</button>
        </div>
        <textarea id="report-text" readonly style="width:100%;min-height:220px;font-family:inherit;font-size:11px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);" onclick="this.select()">${esc(reportText)}</textarea>
      </div>`;
    }

    // Filtro de categoria e status, aplicados às linhas das tabelas de Receitas/Despesas abaixo
    const categoriasNoMes = [...new Set(monthComparison.rows.map((r) => r.categoryId))].map((id) => catById(id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">`;
    html += `<div style="display:flex;align-items:center;gap:8px;"><span class="hint" style="margin:0;">Categoria:</span>`;
    html += `<select class="field" id="filtro-categoria" style="width:auto;padding:5px 8px;font-size:12px;">`;
    html += `<option value="todas" ${state.filtroCategoria === "todas" ? "selected" : ""}>Todas</option>`;
    categoriasNoMes.forEach((c) => { html += `<option value="${c.id}" ${state.filtroCategoria === c.id ? "selected" : ""}>${c.name}</option>`; });
    html += `</select></div>`;
    html += `<div><span class="hint" style="margin:0 8px 0 0;">Status:</span>`;
    [["todos", "Todas"], ["atencao", "Atenção"], ["pendente", "Pendentes"], ["fechado", "Fechadas"]].forEach(([v, label]) => {
      html += `<button class="btn ${state.filtroStatus === v ? "btn-primary" : "btn-outline"}" style="font-size:11px;padding:4px 9px;margin-right:4px;" data-action="set-filtro-status" data-value="${v}">${label}</button>`;
    });
    html += `</div>`;
    html += `</div>`;

    const renderCompTable = (rows, type) => {
      const isReceita = type === "receita";
      const totalPlanejado = isReceita ? monthComparison.totalPlanejadoReceita : monthComparison.totalPlanejadoDespesa - monthComparison.parcPlan;
      const totalAtualizado = isReceita ? monthComparison.totalAtualizadoReceita : monthComparison.totalAtualizadoDespesa - monthComparison.parcAtual;
      const totalRealizado = isReceita ? monthComparison.totalRealizadoReceita : monthComparison.totalRealizadoDespesa - monthComparison.parcReal;
      const naoPrevistoVal = isReceita ? monthComparison.naoPrevistosReceita : monthComparison.naoPrevistosDespesa;
      const pendente = isReceita ? monthComparison.aReceber : monthComparison.aPagar - monthComparison.parcPend;
      const colorClass = isReceita ? "green" : "red";
      const mesFechado = isMonthKeyClosed(monthComparison.key);
      const rowsFiltradas = rows
        .filter((r) => state.filtroCategoria === "todas" || r.categoryId === state.filtroCategoria)
        .filter((r) => state.filtroStatus === "todos" || (state.filtroStatus === "fechado" ? r.finalizado : state.filtroStatus === "atencao" ? ["estourada", "vencida", "vencendo"].includes(metaStatus(r).id) : metaStatus(r).id === state.filtroStatus))
        .map((r, i) => ({ r, i, o: metaStatus(r).ordem }))
        .sort((a, b) => a.o - b.o || a.i - b.i)
        .map((x) => x.r);
      const filtroAtivo = state.filtroCategoria !== "todas" || state.filtroStatus !== "todos";
      const pctGeral = totalAtualizado > 0 ? Math.min(100, (totalRealizado / totalAtualizado) * 100) : 0;

      let h = `<div class="proj-section">`;
      h += `<div class="proj-head"><p class="panel-title" style="margin:0;font-size:14px;">${isReceita ? "📈 Receitas" : "📉 Despesas"} <span class="muted" style="font-weight:400;">· ${rows.length} meta(s)</span></p>`;
      h += `<div class="proj-stats">`;
      h += `<div><span>Planejado</span><b class="muted">${brl(totalPlanejado)}</b></div>`;
      h += `<div><span>Previsão do mês</span><b class="${colorClass}">${brl(totalAtualizado)}</b></div>`;
      h += `<div><span>Realizado</span><b class="${colorClass}">${brl(totalRealizado)}</b></div>`;
      h += `<div><span>${isReceita ? "A receber" : "A pagar"}</span><b>${brl(pendente)}</b></div>`;
      h += `</div></div>`;
      h += `<div class="progress-track" style="margin-bottom:8px;"><div class="progress-fill" style="width:${pctGeral}%;background:${isReceita ? C.green : C.red};"></div></div>`;
      if (naoPrevistoVal > 0) {
        h += `<p class="hint" style="margin:0 0 8px;">Realizado e Previsão do mês incluem <strong>${brl(naoPrevistoVal)}</strong> de lançamentos não previstos (listados mais abaixo).</p>`;
      }
      if (rows.length === 0) {
        h += `<p class="hint" style="margin:0 0 10px;">Nenhuma meta de ${isReceita ? "receita" : "despesa"} cadastrada para este mês.</p></div>`;
        return h;
      }
      if (filtroAtivo) {
        h += `<p class="hint" style="margin:0 0 6px;">Filtro ativo: mostrando ${rowsFiltradas.length} de ${rows.length} metas.</p>`;
      }
      if (rowsFiltradas.length === 0) {
        h += `<p class="hint" style="text-align:center;padding:10px;">Nenhuma meta nesse filtro.</p>`;
      }

      rowsFiltradas.forEach((r) => {
        const sid = `meta-${r.noteKey}`;
        const open = !!state.expanded[sid];
        const alvo = r.atualizado > 0 ? r.atualizado : r.value;
        const pct = alvo > 0 ? Math.min(100, (r.realizado / alvo) * 100) : 0;
        const barColor = r.excedida ? (isReceita ? C.green : C.red) : (r.finalizado || (r.lancado && r.realizado >= r.value)) ? C.green : C.brass;
        const qtd = r.lancamentos.length;
        const stt = metaStatus(r);
        h += `<div class="meta-card st-${stt.id}">`;
        h += `<div class="meta-top" data-action="toggle-section" data-section="${sid}">`;
        h += `<div class="meta-title"><span class="muted">${open ? "▾" : "▸"}</span>${esc(r.description)} <span class="st-tag" style="color:${stt.cor}">${stt.label}</span>`;
        if (r.overridden) h += ` <span class="badge" style="background:var(--badge-brass)">só este mês</span>`;
        h += `</div><div class="meta-nums"><span class="muted">${brl(r.value)}</span><span class="muted">→</span><b style="color:${r.lancado ? C.ink : C.inkSoft}">${r.lancado ? brl(r.realizado) : "—"}</b>`;
        if (r.lancado) h += `<b style="color:${r.favoravel ? C.green : C.red};font-size:11px;">${r.diff >= 0 ? "+" : ""}${brl(r.diff)}</b>`;
        h += `<span class="muted" style="font-size:11px;">${qtd} lanç.</span></div></div>`;
        h += `<div class="meta-bar"><div class="progress-track" style="height:6px;"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div></div>`;

        if (open) {
          h += `<div class="meta-detail"><div class="meta-tools">`;
          if (state.editingOverride === `${monthComparison.key}|${r.id}`) {
            h += `<span>Meta só de ${monthLabel(monthComparison.key)}: <input type="number" step="0.01" min="0" class="note-input" id="ov-input" style="width:90px;text-align:right;" value="${r.value}" /></span><button class="del-btn" data-action="ov-save" title="Salvar (só neste mês)">✓</button><button class="del-btn" data-action="ov-cancel" title="Cancelar">✕</button>`;
          } else {
            h += `<span>Meta do mês: <b>${brl(r.value)}</b>${r.overridden ? ` <span class="muted">(base ${brl(r.baseValue)})</span>` : ""}</span>`;
            if (mesFechado) h += `<span class="muted" title="Mês fechado — reabra para editar">🔒</span>`;
            else {
              h += `<button class="del-btn" data-action="ov-edit" data-id="${r.id}" data-month="${monthComparison.key}" title="Editar a meta só deste mês">✏️</button>`;
              if (r.overridden) h += `<button class="del-btn" data-action="ov-reset" data-id="${r.id}" data-month="${monthComparison.key}" title="Voltar ao valor base">↺</button>`;
            }
          }
          h += `<label style="display:inline-flex;align-items:center;gap:4px;" title="Trava a previsão no valor lançado, mesmo abaixo da projeção"><input type="checkbox" data-action="toggle-finalizado" data-notekey="${r.noteKey}" ${r.finalizado ? "checked" : ""} /> Valor final</label>`;
          if (!r.lancado && !mesFechado) h += `<button class="btn btn-outline" style="font-size:11px;padding:4px 8px;" data-action="quick-launch" data-id="${r.id}" data-year="${state.selectedYear}" data-month="${state.selectedMonth}" title="Lançar pelo valor da meta">⚡ Lançar ${brl(r.value)}</button>`;
          h += `<button class="del-btn" data-action="archive-goal" data-id="${r.id}" data-month="${monthComparison.key}" title="Arquivar meta (deixa de valer a partir do mês seguinte)">📦 arquivar</button>`;
          h += `</div>`;
          h += `<div class="meta-tools" style="margin-bottom:8px;"><label style="display:inline-flex;align-items:center;gap:6px;">Vence dia <input type="number" min="1" max="31" class="note-input" style="width:56px;" placeholder="—" data-action="edit-goal-dia" data-id="${r.id}" value="${r.diaVencimento || ""}" /> <span class="muted">(vazio = ao longo do mês)</span></label></div>`;
          if (state.bichos.length > 0 && !isReceita) {
            const pb = bichosValidos((state.plannedItems.find((x) => x.id === r.id) || {}).bichoIds);
            h += `<div class="bicho-row" style="margin-bottom:8px;"><span class="hint" style="margin:0;">🐾 Bichos desta projeção (herdados pelos novos lançamentos):</span>`;
            state.bichos.forEach((b) => { h += `<button type="button" class="bicho-chip ${pb.includes(b.id) ? "on" : ""}" style="--bc:${esc(b.cor)}" data-action="toggle-meta-bicho" data-id="${r.id}" data-bicho="${b.id}">${esc(b.nome)}</button>`; });
            h += `</div>`;
          }
          h += `<input type="text" class="note-input" style="margin-bottom:8px;" placeholder="anotar..." data-action="edit-note" data-notekey="${r.noteKey}" value="${esc(state.notes[r.noteKey] || "")}" />`;

          h += `<p class="panel-title" style="margin:0 0 4px;">Lançamentos vinculados (${qtd})</p>`;
          if (qtd === 0) {
            h += `<p class="hint" style="margin:0;">Nenhum lançamento vinculado a esta meta neste mês.</p>`;
          } else {
            [...r.lancamentos].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) => {
              const dataCurta = new Date(t.date + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
              h += `<div class="naoprevisto-row"><span><span class="muted">${dataCurta}</span> ${esc(t.description)}${bichoChips(t)}${t.isCartao ? ` <span class="badge" style="background:var(--badge-brass)">💳${t.dueDate ? " vence " + new Date(t.dueDate + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : ""}</span>` : ""}</span>`;
              h += `<span style="display:flex;align-items:center;gap:8px;"><span style="color:${isReceita ? C.green : C.red}">${isReceita ? "+" : "-"}${brl(t.value)}</span>`;
              if (isDateLocked(t.date)) h += `<span class="muted" title="Mês fechado">🔒</span>`;
              else h += `<button class="del-btn" data-action="edit-tx" data-id="${t.id}" title="Editar">✏️</button><button class="del-btn" data-action="del-tx" data-id="${t.id}" title="Excluir">🗑️</button>`;
              h += `</span></div>`;
            });
            h += `<div class="naoprevisto-row" style="border-bottom:none;"><span class="bold">Total realizado</span><span class="bold ${colorClass}">${brl(r.realizado)}</span></div>`;
          }
          h += `</div>`;
        }
        h += `</div>`;
      });
      h += `</div>`;
      return h;
    };

    html += `<div class="proj-cols">`;
    html += renderCompTable(monthComparison.rows.filter((r) => r.type === "receita"), "receita");
    html += renderCompTable(monthComparison.rows.filter((r) => r.type === "despesa"), "despesa");
    html += `</div>`;
    html += renderParcelasBlock(monthComparison);

    const saldoP = monthComparison.totalPlanejadoReceita - monthComparison.totalPlanejadoDespesa;
    const saldoA = monthComparison.totalAtualizadoReceita - monthComparison.totalAtualizadoDespesa;
    const saldoR = monthComparison.totalRealizadoReceita - monthComparison.totalRealizadoDespesa;
    html += `<div class="table-wrap" style="margin-top:16px;"><table><thead><tr><th style="text-align:left">Saldo do mês (receitas − despesas)</th><th>Planejado</th><th>Previsão do mês</th><th>Realizado</th></tr></thead><tbody>`;
    html += `<tr><td style="text-align:left" class="bold">Total</td><td class="bold muted">${brl(saldoP)}</td><td class="bold" style="color:${saldoA >= 0 ? C.green : C.red}">${brl(saldoA)}</td><td class="bold" style="color:${saldoR >= 0 ? C.green : C.red}">${brl(saldoR)}</td></tr>`;
    html += `</tbody></table></div>`;
    html += `<details class="more"><summary>ⓘ como é calculado</summary><p class="hint" style="margin-top:6px;">"Previsão do mês" é a projeção, mas substituída pelo valor real quando ele já foi lançado e ultrapassou a meta (destacado em dourado) — itens abaixo da meta ou ainda não lançados continuam com o valor original. Os não previstos entram na "Previsão do mês" e no "Realizado" de cada tabela.</p></details>`;
    html += `</div>`;
    }

    if (state.area === "lancamentos") {
    html += `<div class="proj-head"><p class="panel-title" style="margin:0;font-size:14px;">🧾 Lançamentos — ${MESES[state.selectedMonth]}/${String(state.selectedYear).slice(2)}</p><span class="muted" style="font-size:12px;">receitas <b class="green">${brl(monthComparison.totalRealizadoReceita)}</b> · despesas <b class="red">${brl(monthComparison.totalRealizadoDespesa)}</b></span></div>`;
    if (monthComparison.naoPrevistos.length > 0) {
      const npReceitas = monthComparison.naoPrevistos.filter((t) => t.type === "receita");
      const npDespesas = monthComparison.naoPrevistos.filter((t) => t.type === "despesa");
      const npSectionId = `np-${monthComparison.key}`;
      const npExpanded = !!state.expanded[npSectionId];
      const renderNpGroup = (list, isReceita) => {
        if (list.length === 0) return "";
        let h = `<p class="panel-title" style="margin:${isReceita ? "0" : "14px"} 0 6px;">${isReceita ? "📈 Receitas" : "📉 Despesas"} não previstas (${list.length})</p>`;
        list.forEach((t) => {
          const cat = catById(t.categoryId);
          h += `<div class="naoprevisto-row"><span>${esc(t.description)}${bichoChips(t)}${cat ? ` <span class="muted">(${cat.name})</span>` : ""}${t.isCartao ? ` <span class="badge" style="background:var(--badge-brass)">💳 cartão${t.dueDate ? " · vence " + new Date(t.dueDate + "T00:00:00").toLocaleDateString("pt-BR") : ""}</span>` : ""}</span>`;
          h += `<span style="display:flex;align-items:center;gap:8px;"><span style="color:${isReceita ? C.green : C.red}">${isReceita ? "+" : "-"}${brl(t.value)}</span>`;
          if (isDateLocked(t.date)) {
            h += `<span class="muted" title="Mês fechado — reabra para editar">🔒</span></span></div>`;
          } else {
            h += `<button class="del-btn" data-action="edit-tx" data-id="${t.id}" title="Editar">✏️</button>`;
            h += `<button class="del-btn" data-action="del-tx" data-id="${t.id}" title="Excluir">🗑️</button></span></div>`;
          }
        });
        const total = list.reduce((s, t) => s + Number(t.value), 0);
        h += `<div class="naoprevisto-row" style="border-bottom:none;border-top:1px solid var(--line);margin-top:2px;padding-top:6px;"><span class="bold">Subtotal</span><span class="bold ${isReceita ? "green" : "red"}">${isReceita ? "+" : "-"}${brl(total)}</span></div>`;
        return h;
      };
      html += `<div class="panel brass">`;
      html += `<p class="panel-title">⚠️ Não previstos (${monthComparison.naoPrevistos.length}) — já contam no saldo projetado</p>`;
      html += `<details class="more"><summary>ⓘ como é calculado</summary><p class="hint" style="margin-top:0;">Esses lançamentos não bateram com nenhuma meta cadastrada, mas o valor deles já está somado na coluna <strong>Previsão do mês</strong> da tabela acima e no <strong>saldo projetado</strong> do topo da página — não precisa fazer nada com eles, a projeção já reflete a realidade.</p></details>`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">`;
      html += `<span class="bold">
          <span class="green">+${brl(monthComparison.naoPrevistosReceita)}</span> ·
          <span class="red">-${brl(monthComparison.naoPrevistosDespesa)}</span> ·
          líquido <span style="color:${monthComparison.naoPrevistosReceita - monthComparison.naoPrevistosDespesa >= 0 ? C.green : C.red}">
            ${brl(monthComparison.naoPrevistosReceita - monthComparison.naoPrevistosDespesa)}
          </span>
        </span>`;
      html += `<button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" data-action="toggle-section" data-section="${npSectionId}">${npExpanded ? "▲ Ocultar lançamentos" : `▾ Ver os ${monthComparison.naoPrevistos.length} lançamentos`}</button>`;
      html += `</div>`;
      if (npExpanded) {
        html += `<div style="margin-top:10px;">`;
        html += renderNpGroup(npReceitas, true);
        html += renderNpGroup(npDespesas, false);
        html += `</div>`;
      }
      html += `</div>`;
    }

    // Lista completa e detalhada de todos os lançamentos reais do período (batendo ou não com metas)
    const realSectionId = `real-${monthComparison.key}`;
    const realExpanded = state.expanded[realSectionId] !== false;
    html += `<div class="panel">`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">`;
    html += `<p class="panel-title" style="margin:0;">Todos os lançamentos reais do período (${monthComparison.allReal.length})</p>`;
    if (monthComparison.allReal.length > 0) {
      html += `<button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" data-action="toggle-section" data-section="${realSectionId}">${realExpanded ? "▲ Ocultar" : "▾ Ver lançamentos"}</button>`;
    }
    html += `</div>`;
    if (monthComparison.allReal.length === 0) {
      html += `<p class="hint" style="margin:8px 0 0;">Nenhum lançamento real ainda neste período.</p>`;
    } else if (realExpanded) {
      html += `<div style="margin-top:10px;">`;
      const porDia = {};
      [...monthComparison.allReal].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) => { (porDia[t.date] = porDia[t.date] || []).push(t); });
      Object.keys(porDia).sort().forEach((dia) => {
        const itens = porDia[dia];
        const liq = itens.reduce((s2, t) => s2 + (t.type === "receita" ? Number(t.value) : -Number(t.value)), 0);
        const dd = new Date(dia + "T00:00:00");
        html += `<div class="day-head"><span class="bold">${pad2(dd.getDate())}/${pad2(dd.getMonth() + 1)} <span class="muted">${DIAS_SEMANA[dd.getDay()]}</span></span><span style="color:${liq >= 0 ? C.green : C.red}">${liq >= 0 ? "+" : ""}${brl(liq)}</span></div>`;
        itens.forEach((t) => {
          const cat = catById(t.categoryId);
          const meta = t.plannedItemId ? state.plannedItems.find((p) => p.id === t.plannedItemId) : null;
          html += `<div class="tx-row"><div class="tx-main"><div>${esc(t.description)}${bichoChips(t)}</div><div class="tx-sub"><span class="badge" style="background:${cat ? cat.color : "var(--badge-gray)"}">${cat ? cat.name : "—"}</span>${meta ? ` <span class="badge" style="background:var(--badge-green)">🏷️ ${esc(meta.description)}</span>` : ""}${parcelaBadge(t)}${t.isCartao ? ` <span class="badge" style="background:var(--badge-brass)">💳${t.dueDate ? " vence " + new Date(t.dueDate + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : ""}</span>` : ""}</div></div>`;
          html += `<div class="tx-side"><span style="color:${t.type === "receita" ? C.green : C.red};font-weight:600;">${t.type === "receita" ? "+" : "-"}${brl(t.value)}</span>${isDateLocked(t.date)
            ? `<span class="muted" title="Mês fechado — reabra para editar">🔒</span>`
            : `<span><button class="del-btn" data-action="edit-tx" data-id="${t.id}" title="Editar">✏️</button><button class="del-btn" data-action="del-tx" data-id="${t.id}" title="Excluir">🗑️</button></span>`}</div></div>`;
        });
      });
      html += `</div>`;
    }
    html += `</div>`;

    // Seção dedicada às compras no cartão, agrupadas por data de vencimento, pra conferir com a fatura —
    // cada vencimento pode ser confirmado como "conferido", encolhendo pra uma linha só.
    // Junta duas coisas: o que foi consumido NESTE mês (isCartao dentro do período por data de compra)

    const { start: pStart0, end: pEnd0 } = getPeriodBounds(state.selectedYear, state.selectedMonth);

    const venceEsteMsDeOutroMs = state.transactions.filter((t) => t.isCartao && t.dueDate && t.dueDate >= pStart0 && t.dueDate <= pEnd0 && !consumidoIds.has(t.id));
    const comprasCartao = [...consumidoEsteMs, ...venceEsteMsDeOutroMs];
    if (comprasCartao.length > 0) {
      const cartaoSectionId = `cartao-${monthComparison.key}`;
      const cartaoExpanded = !!state.expanded[cartaoSectionId];
      const totalCartao = comprasCartao.reduce((s, t) => s + Number(t.value), 0);
      const totalHeranca = venceEsteMsDeOutroMs.reduce((s, t) => s + Number(t.value), 0);
      const totalNovoQueVenceOutroMs = consumidoEsteMs.filter((t) => !t.dueDate || t.dueDate < pStart0 || t.dueDate > pEnd0).reduce((s, t) => s + Number(t.value), 0);
      html += `<div class="panel brass">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">`;

      html += `<button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" data-action="toggle-section" data-section="${cartaoSectionId}">${cartaoExpanded ? "▲ Ocultar" : "▾ Ver por vencimento"}</button>`;
      html += `</div>`;
      if (totalHeranca > 0) {
        html += `<p class="hint" style="margin:6px 0 0;">Desse total, <strong>${brl(totalHeranca)}</strong> já tinha sido gasto em mês(es) anterior(es) e só vence agora — é o "a pagar" que veio de trás.</p>`;

          const venceForaDoMsAtual = k !== "sem-data" && (k < pStart0 || k > pEnd0);
          const mesVencKey = k !== "sem-data" ? k.slice(0, 7) : null;
          const mesVencLabel = mesVencKey ? `${MESES[Number(mesVencKey.slice(5, 7)) - 1]}` : "";
          const label = k === "sem-data" ? "Sem data de vencimento definida" : `Vence em ${new Date(k + "T00:00:00").toLocaleDateString("pt-BR")}`;
          const total = porVencimento[k].reduce((s, t) => s + Number(t.value), 0);
          const reconciliado = !!state.reconciliados[k];
          html += `<div style="margin-top:10px;padding:8px 10px;border:1px solid ${reconciliado ? C.green : venceForaDoMsAtual ? C.brass : "var(--line)"};border-radius:6px;background:${reconciliado ? "var(--ok-bg)" : "transparent"};">`;

          html += `<button class="btn ${reconciliado ? "btn-outline" : "btn-primary"}" style="font-size:11px;padding:4px 8px;" data-action="toggle-reconciliado" data-key="${k}">${reconciliado ? "Reabrir" : "✓ Confirmar reconciliação"}</button>`;
          html += `</div>`;
          if (!reconciliado) {

  }

  // Gráficos de categoria (barras em CSS puro) — despesas e receitas lado a lado

  html += `<div class="legend"><span><i style="background:${C.green}"></i>Receitas</span><span><i style="background:${C.red}"></i>Despesas</span></div>`;

  html += `</div>`;

  }

  html += `</div></div>`; // fecha content e body-panel

}

// Sem preferência salva, segue o sistema; o botão do cabeçalho fixa claro ou escuro neste aparelho.
function effectiveTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  try { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", effectiveTheme() === "dark" ? "#0E1A2E" : "#1E293B"); } catch (e) {}
}
function toggleTheme() {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("lc-theme", next); } catch (e) {}
  render();
}

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue || !EMOJI_RE.test(n.nodeValue)) { EMOJI_RE.lastIndex = 0; return NodeFilter.FILTER_REJECT; }
      EMOJI_RE.lastIndex = 0;
      const tag = n.parentNode && n.parentNode.nodeName.toLowerCase();
      return ["option", "script", "style", "textarea", "title", "text"].includes(tag) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    const frag = document.createDocumentFragment();
    let last = 0, m; const txt = n.nodeValue; EMOJI_RE.lastIndex = 0;
    while ((m = EMOJI_RE.exec(txt))) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const tpl = document.createElement("template"); tpl.innerHTML = iconSVG(EMOJI_ICON[m[1]]);
      frag.appendChild(tpl.content.firstChild);
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}

      else if (action === "set-filtro-status") { state.filtroStatus = el.dataset.value; render(); }
      else if (action === "export-backup") { exportBackup(); }
      else if (action === "import-backup") { document.getElementById("import-file-input").click(); }
      else if (action === "cancel-edit-tx") { cancelEditTransaction(); }
      else if (action === "edit-tx") { startEditTransaction(el.dataset.id); }
      else if (action === "ov-edit") { if (isMonthKeyClosed(el.dataset.month)) { alert(`${monthLabel(el.dataset.month)} está fechado. Reabra o mês pra poder ajustar a meta.`); } else { state.editingOverride = `${el.dataset.month}|${el.dataset.id}`; render(); } }
      else if (action === "ov-cancel") { state.editingOverride = null; render(); }
      else if (action === "ov-save") { saveOverrideFromInput(); }
      else if (action === "ov-reset") { clearMonthOverride(el.dataset.id, el.dataset.month); render(); }
      else if (action === "vig-edit") { state.editingVigencia = el.dataset.id; render(); }

      else if (action === "reopen-month") { reopenMonth(el.dataset.key); }
      else if (action === "toggle-report") { state.showReportFor = state.showReportFor === el.dataset.key ? null : el.dataset.key; render(); }
      else if (action === "copy-report") {
        const ta = document.getElementById("report-text");
        if (ta) {
          ta.select();
          navigator.clipboard?.writeText(ta.value).then(() => {
            el.textContent = "✅ Copiado!"; setTimeout(() => { el.textContent = "📋 Copiar"; }, 1500);
          }).catch(() => { document.execCommand("copy"); });
        }
      }
      else if (action === "del-cat") { deleteCategory(el.dataset.id); }
      else if (action === "del-goal") { deletePlannedItem(el.dataset.id); }
      else if (action === "del-goal-group") { deletePlannedGroup(el.dataset.groupid); }
      else if (action === "del-tx") { deleteTransaction(el.dataset.id); }
    });

    inp.addEventListener("blur", () => persist());
  });

  });
  app.querySelectorAll('[data-action="edit-parc-valor"]').forEach((inp) => {

      const v = Number(e.target.value);
      if (!(v > 0)) { render(); return; }
      state.parcelados = state.parcelados.map((x) => (x.id === inp.dataset.id ? { ...x, valor: v } : x));
      persist(); render();
    });
  });
  app.querySelectorAll('[data-action="edit-goal-dia"]').forEach((inp) => {
    inp.addEventListener("change", (e) => {
      const v = diaValido(e.target.value);
      state.plannedItems = state.plannedItems.map((p) => (p.id === inp.dataset.id ? { ...p, diaVencimento: v } : p));
      persist(); render();
    });
  });
  app.querySelectorAll('[data-action="toggle-finalizado"]').forEach((chk) => {
    chk.addEventListener("change", () => toggleFinalizado(chk.dataset.notekey));
  });
  app.querySelectorAll('[data-action="toggle-show-archived"]').forEach((chk) => {
    chk.addEventListener("change", () => { state.showArchived = chk.checked; render(); });
  });
  const ovInput = document.getElementById("ov-input");
  if (ovInput) {
    ovInput.focus(); ovInput.select();
    ovInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); saveOverrideFromInput(); }
      else if (e.key === "Escape") { state.editingOverride = null; render(); }
    });
  }
  if (state.editingVigencia) {
    const vFirst = document.getElementById("vig-month") || document.getElementById("vig-start");
    if (vFirst) {
      vFirst.focus();
      [document.getElementById("vig-month"), document.getElementById("vig-start"), document.getElementById("vig-end")].forEach((inp) => {
        if (!inp) return;
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); saveVigencia(state.editingVigencia); }
          else if (e.key === "Escape") { state.editingVigencia = null; render(); }
        });
      });
    }
  }
  const filtroCatSelect = document.getElementById("filtro-categoria");
  if (filtroCatSelect) {
    filtroCatSelect.addEventListener("change", (e) => { state.filtroCategoria = e.target.value; render(); });
  }

  const importInput = document.getElementById("import-file-input");
  if (importInput) {
    importInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
  }

  const txForm = document.getElementById("tx-form");
  if (txForm) {
    txForm.addEventListener("submit", addTransaction);
    document.getElementById("tx-type").addEventListener("change", (e) => { form.type = e.target.value; form.categoryId = categoriesForType(e.target.value)[0]?.id || ""; form.plannedItemId = ""; render(); });
    document.getElementById("tx-date").addEventListener("input", (e) => { form.date = e.target.value; });
    document.getElementById("tx-date").addEventListener("change", (e) => {
      form.date = e.target.value;
      // Trocou a data → o mês de planejamento pode mudar: recalcula quais metas estão vigentes.
      const ativas = plannedActiveForDate(form.date, form.type);
      if (form.plannedItemId && !ativas.some((p) => p.id === form.plannedItemId)) form.plannedItemId = "";
      if (!form.plannedItemId) form.plannedItemId = suggestPlannedItemId(form.description, form.type, form.categoryId, form.date);
      if (form.isCartao && form.cartaoId) {
        const cartao = state.cartoes.find((c) => c.id === form.cartaoId);
        if (cartao) form.dueDate = nextDueDate(cartao.vencimentoDia, form.date);
      }
      render();
    });
    document.getElementById("tx-desc").addEventListener("input", (e) => { form.description = e.target.value; });
    document.getElementById("tx-desc").addEventListener("blur", () => {
      if (!form.plannedItemId) {
        const suggestion = suggestPlannedItemId(form.description, form.type, form.categoryId, form.date);
        if (suggestion) { form.plannedItemId = suggestion; render(); }
      }
    });
    document.getElementById("tx-cat").addEventListener("change", (e) => {
      form.categoryId = e.target.value;
      if (!form.plannedItemId) { form.plannedItemId = suggestPlannedItemId(form.description, form.type, form.categoryId, form.date); }
      render();
    });
    document.getElementById("tx-value").addEventListener("input", (e) => { form.value = e.target.value; });
    const txMetaEl = document.getElementById("tx-meta"); if (txMetaEl) txMetaEl.addEventListener("change", (e) => { form.plannedItemId = e.target.value; });
    document.getElementById("tx-forma").addEventListener("change", (e) => {
      form.formaPagamento = e.target.value;
      if (e.target.value === "pix" || e.target.value === "dinheiro") {
        form.isCartao = false; form.cartaoId = null; form.dueDate = "";
      } else if (e.target.value === "legacy-cartao") {
        form.isCartao = true; form.cartaoId = null; // mantém a dueDate já existente do lançamento antigo
      } else {
        form.isCartao = true; form.cartaoId = e.target.value;
        const cartao = state.cartoes.find((c) => c.id === e.target.value);
        if (cartao) form.dueDate = nextDueDate(cartao.vencimentoDia, form.date);
      }
      render();
    });
    const txDue = document.getElementById("tx-duedate"); if (txDue) txDue.addEventListener("input", (e) => { form.dueDate = e.target.value; });
  }

  const catForm = document.getElementById("cat-form");
  if (catForm) {
    catForm.addEventListener("submit", addCategory);
    document.getElementById("newcat-type").addEventListener("change", (e) => { newCat.type = e.target.value; });
    document.getElementById("newcat-name").addEventListener("input", (e) => { newCat.name = e.target.value; });

  const cartaoForm = document.getElementById("cartao-form");

    document.getElementById("newloan-parcela").addEventListener("input", (e) => { newLoan.parcela = e.target.value; });
    document.getElementById("newloan-totais").addEventListener("input", (e) => { newLoan.parcelasTotais = e.target.value; });
    document.getElementById("newloan-taxa").addEventListener("input", (e) => { newLoan.taxaJurosMensal = e.target.value; });
  }
  app.querySelectorAll('[data-action="edit-loan-taxa"]').forEach((inp) => {

  app.querySelectorAll('[data-action="np-valor"]').forEach((inp) => {

  const reportCatMonthEl = document.getElementById("report-cat-month");
  if (reportCatMonthEl) reportCatMonthEl.addEventListener("change", (e) => { state.reportCatMonth = e.target.value; render(); });

  const reportBichoMonthEl = document.getElementById("report-bicho-month");
  if (reportBichoMonthEl) reportBichoMonthEl.addEventListener("change", (e) => { state.reportBichoMonth = e.target.value; render(); });
  const reportBichoSelEl = document.getElementById("report-bicho-sel");
  if (reportBichoSelEl) reportBichoSelEl.addEventListener("change", (e) => { state.reportBichoSel = e.target.value; render(); });

    const gi = document.getElementById("goal-installments"); if (gi) gi.addEventListener("input", (e) => { goalForm.installments = e.target.value; });
    const gis = document.getElementById("goal-install-start"); if (gis) gis.addEventListener("input", (e) => { goalForm.installStartMonth = e.target.value; });
